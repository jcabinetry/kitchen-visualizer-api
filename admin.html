<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabinet Visualizer Admin</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;color:#172033;background:#f5f7fb}.boot{width:min(560px,calc(100vw - 32px));background:#fff;border:1px solid #d9dee8;border-radius:14px;box-shadow:0 10px 30px rgba(23,32,51,.08);padding:22px}.boot h1{margin:0 0 8px;font-size:24px}.boot p{margin:0;color:#647084;line-height:1.5}
</style>
</head>
<body>
<div class="boot"><h1>Loading admin...</h1><p>Create Customer, Catalog Manager, and Temporary Demo Access will load as separate admin cards.</p></div>
<script>
const ADMIN_SOURCE='https://raw.githubusercontent.com/jcabinetry/kitchen-visualizer-api/5fef209fd27b1d7906408b9258124637fe58eb6a/admin.html';
const EXTRA_CSS='.admin-side{display:grid;gap:16px;align-self:start}.admin-extra-card{padding:16px;display:grid;gap:12px}.admin-extra-card p{margin:0;color:var(--muted);line-height:1.5}.demo-access-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.demo-access-result{display:none;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;line-height:1.55}.demo-access-result.active{display:block}.demo-pin-value{font-size:30px;font-weight:950;letter-spacing:.08em;color:var(--green)}.catalog-modal{display:none;position:fixed;inset:0;z-index:100000;background:rgba(15,23,42,.62);padding:18px}.catalog-modal.active{display:block}.catalog-modal-shell{height:100%;max-width:1160px;margin:auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}.catalog-modal-close{float:right;margin:10px;border:0;border-radius:10px;background:#fff0ee;color:#b42318;padding:10px 14px;font-weight:900}.catalog-modal iframe{width:100%;height:100%;border:0}@media(max-width:980px){.layout>.admin-side{order:-1;width:100%}}@media(max-width:760px){.demo-access-grid{grid-template-columns:1fr}}';
const CATALOG_CARD='<aside class="panel catalog-manager-panel"><div class="panel-header"><h2>Catalog Manager</h2></div><section class="admin-extra-card"><p>Open the manufacturer catalog manager without leaving this admin dashboard.</p><button class="primary" id="cvCatBtn" type="button">Open Catalog Manager</button></section></aside>';
const DEMO_CARD='<aside class="panel demo-access-panel"><div class="panel-header"><h2>Temporary Demo Access</h2></div><section class="admin-extra-card"><div class="demo-access-grid"><label>Demo Type<select id="demoType"><option value="showroom">Showroom</option><option value="lead">Lead Gen</option><option value="custom">Custom Visualizer</option></select></label><label>Duration<select id="demoDuration"><option value="24">24 hours</option><option value="48">48 hours</option><option value="72">72 hours</option><option value="168">7 days</option><option value="336">14 days</option><option value="720">30 days</option></select></label></div><button class="primary" id="generateDemoPinButton" type="button">Generate Demo PIN</button><div id="demoPinResult" class="demo-access-result"><div>PIN</div><div id="demoPinValue" class="demo-pin-value"></div><div><strong>Demo type:</strong> <span id="demoPinType"></span></div><div><strong>Expiration:</strong> <span id="demoPinExpires"></span></div><div class="helper-actions"><button class="neutral" id="copyDemoPinButton" type="button">Copy PIN</button><button class="link-button" id="copyDemoInstructionsButton" type="button">Copy demo instructions</button></div></div></section></aside>';
const CATALOG_MODAL='<div id="cvCatModal" class="catalog-modal"><div class="catalog-modal-shell"><button id="cvCatClose" class="catalog-modal-close" type="button">Close</button><iframe src="/catalog-dashboard-v2.html"></iframe></div></div>';
const ELEMENTS_PATCH='customerCatalogList:document.getElementById("customerCatalogList"),demoType:document.getElementById("demoType"),demoDuration:document.getElementById("demoDuration"),generateDemoPinButton:document.getElementById("generateDemoPinButton"),demoPinResult:document.getElementById("demoPinResult"),demoPinValue:document.getElementById("demoPinValue"),demoPinType:document.getElementById("demoPinType"),demoPinExpires:document.getElementById("demoPinExpires"),copyDemoPinButton:document.getElementById("copyDemoPinButton"),copyDemoInstructionsButton:document.getElementById("copyDemoInstructionsButton")};';
const DEMO_JS='let latestDemoPin=null;function demoTypeLabel(value){return value==="lead"?"Lead Gen":value==="custom"?"Custom Visualizer":"Showroom"}function demoPageUrl(value){const pages={showroom:"demo-showroom-visualizer.html",lead:"demo-lead-visualizer.html",custom:"demo-custom-visualizer.html"};return new URL(pages[value]||pages.showroom,window.location.href).href}function demoInstructions(record){return "Open "+demoPageUrl(record.demoType)+"\\nEnter temporary PIN: "+record.pin+"\\nDemo type: "+demoTypeLabel(record.demoType)+"\\nExpires: "+new Date(record.expiresAt).toLocaleString()}async function generateDemoPin(){setBusy(true);setStatus("Generating demo PIN...");try{const data=await api("/api/admin/demo-pins",{method:"POST",body:JSON.stringify({demoType:elements.demoType.value,durationHours:Number(elements.demoDuration.value)})});latestDemoPin=data.demoPin;elements.demoPinValue.textContent=latestDemoPin.pin;elements.demoPinType.textContent=demoTypeLabel(latestDemoPin.demoType);elements.demoPinExpires.textContent=new Date(latestDemoPin.expiresAt).toLocaleString();elements.demoPinResult.classList.add("active");setStatus("Demo PIN generated.")}catch(e){setStatus(e.message,true)}finally{setBusy(false)}}';
const EXTRA_EVENTS='elements.copyEditorCustomButton.addEventListener("click",()=>copyText(embedSnippet(field("companyKey").value.trim(),"custom"),"Custom visualizer embed copied."));elements.generateDemoPinButton.addEventListener("click",generateDemoPin);elements.copyDemoPinButton.addEventListener("click",()=>latestDemoPin&&copyText(latestDemoPin.pin,"Demo PIN copied."));elements.copyDemoInstructionsButton.addEventListener("click",()=>latestDemoPin&&copyText(demoInstructions(latestDemoPin),"Demo instructions copied."));const cvCatModal=document.getElementById("cvCatModal"),cvCatBtn=document.getElementById("cvCatBtn"),cvCatClose=document.getElementById("cvCatClose");if(cvCatBtn)cvCatBtn.addEventListener("click",()=>cvCatModal&&cvCatModal.classList.add("active"));if(cvCatClose)cvCatClose.addEventListener("click",()=>cvCatModal&&cvCatModal.classList.remove("active"));window.addEventListener("message",event=>{if(event.data&&event.data.type==="catalogs-updated"){const refresh=document.getElementById("refreshCatalogsButton");if(refresh)refresh.click();setTimeout(()=>setStatus("Catalog list refreshed."),500)}});';
function patchAdmin(html){
  return html
    .replaceAll('/api/import-catalog','/api/import-catalog-any')
    .replace('.pill{background:#eef1f6;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;color:#384152}\n@media(max-width:1320px)', '.pill{background:#eef1f6;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;color:#384152}'+EXTRA_CSS+'\n@media(max-width:1320px)')
    .replace('<aside class="panel"><div class="panel-header"><h2 id="editorTitle">Create Customer</h2>', '<div class="admin-side"><aside class="panel"><div class="panel-header"><h2 id="editorTitle">Create Customer</h2>')
    .replace('</form><div id="statusLine" class="status-line"></div></aside></section>', '</form><div id="statusLine" class="status-line"></div></aside>'+CATALOG_CARD+DEMO_CARD+'</div></section>')
    .replace('</body>', CATALOG_MODAL+'</body>')
    .replace('customerCatalogList:document.getElementById("customerCatalogList")};', ELEMENTS_PATCH)
    .replace('elements.monthInput.value=thisMonth();', DEMO_JS+'elements.monthInput.value=thisMonth();')
    .replace('elements.copyEditorCustomButton.addEventListener("click",()=>copyText(embedSnippet(field("companyKey").value.trim(),"custom"),"Custom visualizer embed copied."));', EXTRA_EVENTS);
}
fetch(ADMIN_SOURCE,{cache:'no-store'})
  .then(function(response){if(!response.ok)throw new Error('Could not load admin page.');return response.text();})
  .then(function(html){document.open();document.write(patchAdmin(html));document.close();})
  .catch(function(error){document.querySelector('.boot p').textContent='Admin failed to load: '+error.message;});
</script>
</body>
</html>
