<!doctype html>
<html lang="en">
<head>

<title>Cabinet Visualizer Admin</title>
<style>
:root{--ink:#172033;--muted:#647084;--line:#d9dee8;--panel:#fff;--page:#f5f7fb;--green:#16785f;--red:#b42318;--amber:#b76e00;--blue:#2457a6;--blue-soft:#edf3ff;--shadow:0 10px 30px rgba(23,32,51,.08)}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f8faff 0,var(--page) 260px)}button,input,textarea,select{font:inherit}button{border:0;border-radius:10px;cursor:pointer;min-height:40px;padding:0 14px;font-weight:800}button:disabled{cursor:wait;opacity:.7}input,select,textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:9px 11px;outline:none}textarea{min-height:82px;resize:vertical}.shell{width:min(1480px,calc(100vw - 32px));margin:0 auto;padding:24px 0 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}h1{margin:0;font-size:28px}.month-picker{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:800}.month-picker input{width:150px}.summary-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:12px;margin-bottom:18px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.metric{padding:16px}.metric span{display:block;color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase}.metric strong{display:block;margin-top:8px;font-size:28px;line-height:1}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(420px,.85fr);gap:16px;align-items:start}.panel-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.panel-header h2{margin:0;font-size:18px}.toolbar{display:flex;align-items:center;gap:8px}.toolbar input,.toolbar select{width:180px}.customer-list{display:grid;gap:14px;padding:16px}.customer-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:grid;gap:14px}.customer-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.customer-brand{display:flex;align-items:center;gap:12px;min-width:0}.logo-box{width:52px;height:52px;border:1px solid var(--line);border-radius:14px;background:#fafbfe;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}.logo-box img{width:100%;height:100%;object-fit:contain}.logo-fallback{font-size:18px;font-weight:900;color:var(--blue)}.company-name b{display:block;font-size:18px;line-height:1.2}.company-name small{display:block;color:var(--muted);margin-top:3px;word-break:break-all}.badge-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.badge,.plan-badge{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:900}.badge{background:#edf8f4;color:var(--green)}.badge.archived{background:#f2f4f7;color:#596276}.plan-badge{background:var(--blue-soft);color:var(--blue)}.customer-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.info{border:1px solid #eef1f6;background:#fafbfe;border-radius:12px;padding:10px;min-width:0}.info span{display:block;font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}.info strong{font-size:14px;word-break:break-word}.usage-box{grid-column:span 2}.usage-bar{width:100%;height:9px;overflow:hidden;border-radius:999px;background:#e7ebf2;margin-top:8px}.usage-bar span{display:block;height:100%;width:var(--value,0%);background:var(--green)}.usage-bar.warn span{background:var(--amber)}.usage-bar.over span{background:var(--red)}.row-actions{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;border-top:1px solid #eef1f6;padding-top:14px}.row-actions button{width:100%;min-height:42px}.link-button{background:var(--blue-soft);color:var(--blue)}.primary{background:var(--blue);color:#fff}.danger{background:#fff0ee;color:var(--red)}.neutral{background:#eef1f6;color:var(--ink)}.success{background:#edf8f4;color:var(--green)}form{padding:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase}.full{grid-column:1/-1}.form-actions{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.helper-box{grid-column:1/-1;border:1px solid var(--line);border-radius:12px;background:#fafbfe;padding:12px;display:grid;gap:10px}.helper-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.helper-actions{display:flex;gap:8px;flex-wrap:wrap}.snippet{margin:0;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px;color:#263042;font-size:12px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.status-line{min-height:22px;padding:0 16px 16px;color:var(--muted);font-size:13px}.status-line.error{color:var(--red)}.empty{padding:24px 16px;color:var(--muted);text-align:center}.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.login-panel{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:24px}.login-panel h1{font-size:24px;margin-bottom:8px}.login-panel p{margin:0 0 18px;color:var(--muted)}.login-error{min-height:22px;margin-top:12px;color:var(--red);font-size:13px}
@media(max-width:1320px){.summary-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.customer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.usage-box{grid-column:span 2}.row-actions{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:980px){.summary-grid,.layout{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.toolbar{align-items:stretch;flex-direction:column;width:100%}.toolbar input,.toolbar select,.toolbar button{width:100%}.layout{display:flex;flex-direction:column}.layout>aside.panel{order:-1;width:100%}.layout>div.panel{width:100%}}
@media(max-width:760px){.shell{width:min(100%,calc(100vw - 18px));padding:12px 0 28px}.topbar{position:sticky;top:0;z-index:10;background:rgba(248,250,255,.96);padding:10px 0;backdrop-filter:blur(8px)}h1{font-size:22px}.summary-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{padding:12px}.metric strong{font-size:22px}.panel-header{align-items:stretch;flex-direction:column}.customer-top{flex-direction:column}.badge-row{justify-content:flex-start}.customer-grid{grid-template-columns:1fr}.usage-box{grid-column:auto}.row-actions{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.form-actions{flex-direction:column-reverse}.form-actions button{width:100%}.helper-top{align-items:stretch;flex-direction:column}.helper-actions{display:grid;grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="loginShell" class="login-shell" hidden><form id="loginForm" class="login-panel"><h1>Admin Login</h1><p>Enter your admin API token to manage customers.</p><label>Admin API token<input id="adminTokenInput" type="password" required></label><div class="login-actions"><button class="primary" id="loginButton" type="submit">Continue</button></div><div id="loginError" class="login-error"></div></form></section>
<main class="shell" id="adminShell" hidden>
<header class="topbar"><h1>Cabinet Visualizer Admin</h1><label class="month-picker">Month <input id="monthInput" type="month"></label></header>
<section class="summary-grid"><div class="metric"><span>Total Customers</span><strong id="totalCustomers">0</strong></div><div class="metric"><span>Active Customers</span><strong id="activeCustomers">0</strong></div><div class="metric"><span>Images This Month</span><strong id="totalPreviews">0</strong></div><div class="metric"><span>MRR</span><strong id="monthlyRevenue">$0</strong></div><div class="metric"><span>ARR</span><strong id="annualRevenue">$0</strong></div><div class="metric"><span>Avg Revenue / Customer</span><strong id="avgRevenue">$0</strong></div><div class="metric"><span>AI Cost</span><strong id="aiSpend">$0.00</strong></div><div class="metric"><span>Gross Profit</span><strong id="grossProfit">$0</strong></div></section>
<section class="layout"><div class="panel"><div class="panel-header"><h2>Customers</h2><div class="toolbar"><input id="searchInput" type="search" placeholder="Search"><select id="statusFilter"><option value="all">All</option><option value="active">Active</option><option value="archived">Inactive</option></select><button class="neutral" id="refreshButton" type="button">Refresh</button></div></div><div id="customerRows" class="customer-list"></div><div id="emptyState" class="empty" hidden>No customers found.</div></div>
<aside class="panel"><div class="panel-header"><h2 id="editorTitle">Create Customer</h2><button class="neutral" id="newButton" type="button">New</button></div><form id="customerForm"><div class="form-grid"><label>Company key<input id="companyKey" name="companyKey" required placeholder="company-name"></label><label>Monthly limit<input id="monthlyLimit" name="monthlyLimit" type="number" min="1" step="1" value="200" required></label><label>Monthly Price ($)<input id="monthlyPrice" name="monthlyPrice" type="number" min="0" step="1" value="199"></label><label class="full">Company name<input id="companyName" name="companyName" required placeholder="Company Name"></label><label>Plan<select id="plan" name="plan"><option value="Trial">Trial</option><option value="Starter">Starter</option><option value="Professional">Professional</option><option value="Enterprise">Enterprise</option></select></label><label>Status<select id="status" name="status"><option value="active">Active</option><option value="archived">Inactive</option></select></label><label>Phone<input id="phone" name="phone" type="tel" placeholder="(555) 555-5555"></label><label>Email<input id="email" name="email" type="email" placeholder="email@example.com"></label><label>City<input id="city" name="city" placeholder="City, ST"></label><label>Primary color<input id="primaryColor" name="primaryColor" type="color" value="#1f2937"></label><label>Secondary color<input id="secondaryColor" name="secondaryColor" type="color" value="#64748b"></label><label>Accent color<input id="accentColor" name="accentColor" type="color" value="#2563eb"></label><label>Background color<input id="backgroundColor" name="backgroundColor" type="color" value="#f8fafc"></label><label>Card color<input id="cardColor" name="cardColor" type="color" value="#ffffff"></label><label class="full">Customer Page URL<input id="websiteUrl" name="websiteUrl" type="url" placeholder="https://example.com/customer-page"></label><label class="full">Estimate URL<input id="estimateUrl" name="estimateUrl" placeholder="https://example.com/estimate"></label><label class="full">Logo URL<input id="logoUrl" name="logoUrl" type="url"></label><label class="full">Button text<input id="ctaText" name="ctaText" placeholder="Request an Estimate"></label><label class="full">Notes<textarea id="notes" name="notes"></textarea></label><div class="helper-box"><div class="helper-top"><strong>Customer key: <span id="helperKey">-</span></strong><div class="helper-actions"><button class="neutral" id="copyEditorKeyButton" type="button">Copy Customer Key</button><button class="link-button" id="copyEditorLeadButton" type="button">Copy Lead Visualizer</button><button class="link-button" id="copyEditorShowroomButton" type="button">Copy Showroom Visualizer</button></div></div><pre class="snippet" id="helperSnippet"></pre></div></div><div class="form-actions"><button class="danger" id="archiveButton" type="button" hidden>Deactivate</button><button class="primary" id="saveButton" type="submit">Save Customer</button></div></form><div id="statusLine" class="status-line"></div></aside></section></main>
<script>
const state={token:"Doobie85",customers:[],selectedKey:""};
const elements={loginShell:document.getElementById("loginShell"),adminShell:document.getElementById("adminShell"),loginForm:document.getElementById("loginForm"),adminTokenInput:document.getElementById("adminTokenInput"),loginButton:document.getElementById("loginButton"),loginError:document.getElementById("loginError"),monthInput:document.getElementById("monthInput"),totalCustomers:document.getElementById("totalCustomers"),activeCustomers:document.getElementById("activeCustomers"),totalPreviews:document.getElementById("totalPreviews"),monthlyRevenue:document.getElementById("monthlyRevenue"),annualRevenue:document.getElementById("annualRevenue"),avgRevenue:document.getElementById("avgRevenue"),aiSpend:document.getElementById("aiSpend"),grossProfit:document.getElementById("grossProfit"),customerRows:document.getElementById("customerRows"),emptyState:document.getElementById("emptyState"),searchInput:document.getElementById("searchInput"),statusFilter:document.getElementById("statusFilter"),refreshButton:document.getElementById("refreshButton"),newButton:document.getElementById("newButton"),editorTitle:document.getElementById("editorTitle"),customerForm:document.getElementById("customerForm"),archiveButton:document.getElementById("archiveButton"),saveButton:document.getElementById("saveButton"),statusLine:document.getElementById("statusLine"),helperKey:document.getElementById("helperKey"),helperSnippet:document.getElementById("helperSnippet"),copyEditorKeyButton:document.getElementById("copyEditorKeyButton"),copyEditorLeadButton:document.getElementById("copyEditorLeadButton"),copyEditorShowroomButton:document.getElementById("copyEditorShowroomButton")};
function thisMonth(){return new Date().toISOString().slice(0,7)}function field(id){return document.getElementById(id)}function setBusy(b){elements.refreshButton.disabled=b;elements.saveButton.disabled=b;elements.archiveButton.disabled=b}function setStatus(m,e=false){elements.statusLine.textContent=m||"";elements.statusLine.classList.toggle("error",e)}function showLogin(m=""){elements.adminShell.hidden=true;elements.loginShell.hidden=false;elements.loginError.textContent=m;elements.adminTokenInput.focus()}function showAdmin(){elements.loginShell.hidden=true;elements.adminShell.hidden=false;elements.loginError.textContent=""}function getToken(){return state.token||""}function money(v){return "$"+Number(v||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2})}function customerMonthlyPrice(c){return Number(c.monthlyPrice??c.price??c.subscriptionPrice??0)}
async function api(path,options={}){const token=getToken();if(!token)throw new Error("Admin API token required.");const response=await fetch(path,{...options,cache:"no-store",headers:{"Content-Type":"application/json","X-Admin-Token":token,...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok){if(response.status===401){state.token="";showLogin("Wrong admin API token.")}throw new Error(data.error||"Request failed.")}return data}
function customerEmail(c){return c.email||c.contactEmail||c.branding?.email||c.branding?.contactEmail||""}function customerPhone(c){return c.phone||c.branding?.phone||""}function customerCity(c){return c.city||c.branding?.city||""}function customerEstimateUrl(c){return c.estimateUrl||c.branding?.estimateUrl||c.branding?.websiteUrl||c.websiteUrl||""}function customerWebsiteUrl(c){return c.websiteUrl||c.website||c.customerPageUrl||c.branding?.websiteUrl||c.branding?.website||""}function customerLogoUrl(c){return c.logoUrl||c.branding?.logoUrl||""}function customerPrimaryColor(c){return c.primaryColor||c.branding?.primaryColor||"#1f2937"}function customerSecondaryColor(c){return c.secondaryColor||c.branding?.secondaryColor||"#64748b"}function customerAccentColor(c){return c.accentColor||c.branding?.accentColor||"#2563eb"}function customerBackgroundColor(c){return c.backgroundColor||c.branding?.backgroundColor||"#f8fafc"}function customerCardColor(c){return c.cardColor||c.branding?.cardColor||"#ffffff"}function customerCtaText(c){return c.ctaText||c.buttonText||c.branding?.ctaText||c.branding?.buttonText||"Request an Estimate"}function customerPlan(c){return c.plan||"Trial"}function usagePercent(c){const used=Number(c.usage?.used||0),limit=Number(c.monthlyLimit||1);return Math.min(100,Math.round((used/limit)*100))}function isActive(c){return c.status!=="archived"}function formatDate(v){if(!v)return"-";const d=new Date(v);return Number.isNaN(d.getTime())?"-":d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}
function embedSnippet(companyKey,type="lead"){const key=String(companyKey||"").trim();const file=type==="showroom"?"showroom-visualizer.html":"lead-visualizer.html";return `<iframe\nsrc="https://kitchen-visualizer-api.vercel.app/${file}?companyKey=${key}"\nstyle="width:100%;height:2100px;border:none;background:white;"\nloading="lazy">\n</iframe>`}
async function copyText(value,message){const text=String(value||"");if(!text)return;try{await navigator.clipboard.writeText(text)}catch(_){const t=document.createElement("textarea");t.value=text;t.setAttribute("readonly","");t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}setStatus(message||"Copied.")}
function updateHelper(){const key=field("companyKey").value.trim();elements.helperKey.textContent=key||"-";elements.helperSnippet.textContent=embedSnippet(key||"customer-key","lead")}function escapeHtml(v){return String(v??"").replace(/[&<>\"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch]))}function escapeAttr(v){return escapeHtml(v).replace(/'/g,"&#39;")}
function filteredCustomers(){const q=elements.searchInput.value.trim().toLowerCase(),s=elements.statusFilter.value;return state.customers.filter(c=>{const matches=s==="all"||c.status===s;const hay=`${c.companyName} ${c.companyKey} ${customerPlan(c)} ${customerEmail(c)} ${customerPhone(c)} ${customerCity(c)}`.toLowerCase();return matches&&(!q||hay.includes(q))})}
function renderSummary(){const active=state.customers.filter(isActive);const totalPreviews=state.customers.reduce((sum,c)=>sum+Number(c.usage?.used||0),0);const mrr=active.reduce((sum,c)=>sum+customerMonthlyPrice(c),0);const aiCost=totalPreviews*.02;const grossProfit=mrr-aiCost;const avgRevenue=active.length?mrr/active.length:0;elements.totalCustomers.textContent=state.customers.length;elements.activeCustomers.textContent=active.length;elements.totalPreviews.textContent=totalPreviews;elements.monthlyRevenue.textContent=money(mrr);elements.annualRevenue.textContent=money(mrr*12);elements.avgRevenue.textContent=money(avgRevenue);elements.aiSpend.textContent=money(aiCost);elements.grossProfit.textContent=money(grossProfit)}
function info(label,value){return `<div class="info"><span>${label}</span><strong>${value}</strong></div>`}
function renderRows(){const customers=filteredCustomers();elements.customerRows.innerHTML="";elements.emptyState.hidden=customers.length>0;customers.forEach(c=>{const used=Number(c.usage?.used||0),limit=Number(c.monthlyLimit||0),remaining=Math.max(0,limit-used),monthlyPrice=customerMonthlyPrice(c),aiCost=used*.02,estProfit=monthlyPrice-aiCost,percent=usagePercent(c),barClass=percent>=100?"over":percent>=80?"warn":"",active=isActive(c),toggleLabel=active?"Deactivate":"Activate",toggleClass=active?"danger":"success",toggleAction=active?"deactivate":"activate",websiteUrl=customerWebsiteUrl(c),logo=customerLogoUrl(c);const card=document.createElement("article");card.className="customer-card";card.innerHTML=`<div class="customer-top"><div class="customer-brand"><div class="logo-box">${logo?`<img src="${escapeAttr(logo)}" alt="">`:`<span class="logo-fallback">${escapeHtml(String(c.companyName||"?").slice(0,1).toUpperCase())}</span>`}</div><span class="company-name"><b>${escapeHtml(c.companyName||"Untitled")}</b><small>${escapeHtml(c.companyKey||"")}</small></span></div><div class="badge-row"><span class="plan-badge">${escapeHtml(customerPlan(c))}</span><span class="badge ${active?"":"archived"}">${active?"active":"inactive"}</span></div></div><div class="customer-grid">${info("Monthly Price",money(monthlyPrice))}${info("Limit",escapeHtml(limit||"-"))}${info("Remaining",escapeHtml(remaining))}${info("City",escapeHtml(customerCity(c)||"-"))}<div class="info usage-box"><span>Usage</span><strong>${used} used / ${limit||0}</strong><div class="usage-bar ${barClass}" style="--value:${percent}%"><span></span></div></div>${info("AI Cost",money(aiCost))}${info("Est. Profit",money(estProfit))}${info("Created",escapeHtml(formatDate(c.createdAt)))}${info("Email",escapeHtml(customerEmail(c)||"-"))}${info("Phone",escapeHtml(customerPhone(c)||"-"))}</div><div class="row-actions"><button class="neutral" type="button" data-action="copy-key" data-key="${escapeAttr(c.companyKey)}">Copy Key</button><button class="link-button" type="button" data-action="copy-lead" data-key="${escapeAttr(c.companyKey)}">Copy Lead</button><button class="link-button" type="button" data-action="copy-showroom" data-key="${escapeAttr(c.companyKey)}">Copy Showroom</button>${websiteUrl?`<button class="link-button" type="button" data-action="open-page" data-url="${escapeAttr(websiteUrl)}">Open Page</button>`:""}<button class="link-button" type="button" data-action="edit" data-key="${escapeAttr(c.companyKey)}">Edit</button><button class="neutral" type="button" data-action="reset" data-key="${escapeAttr(c.companyKey)}">Reset</button><button class="${toggleClass}" type="button" data-action="${toggleAction}" data-key="${escapeAttr(c.companyKey)}">${toggleLabel}</button><button class="danger" type="button" data-action="delete" data-key="${escapeAttr(c.companyKey)}">Delete</button></div>`;elements.customerRows.appendChild(card)})}
function render(){renderSummary();renderRows()}function resetForm(){state.selectedKey="";elements.editorTitle.textContent="Create Customer";elements.archiveButton.hidden=true;elements.customerForm.reset();field("companyKey").disabled=false;field("monthlyLimit").value="200";field("monthlyPrice").value="199";field("plan").value="Trial";field("primaryColor").value="#1f2937"; field("secondaryColor").value="#64748b"; field("accentColor").value="#2563eb"; field("backgroundColor").value="#f8fafc"; field("cardColor").value="#ffffff";field("ctaText").value="Request an Estimate";updateHelper();setStatus("");document.getElementById("customerForm").scrollIntoView({behavior:"smooth",block:"start"})}
function editCustomer(companyKey){const c=state.customers.find(i=>i.companyKey===companyKey);if(!c)return;state.selectedKey=companyKey;elements.editorTitle.textContent="Edit Customer";elements.archiveButton.hidden=!isActive(c);field("companyKey").disabled=true;field("companyKey").value=c.companyKey;field("companyName").value=c.companyName||"";field("monthlyLimit").value=c.monthlyLimit||200;field("monthlyPrice").value=customerMonthlyPrice(c);field("plan").value=customerPlan(c);field("status").value=c.status||"active";field("phone").value=customerPhone(c);field("email").value=customerEmail(c);field("city").value=customerCity(c);field("primaryColor").value=customerPrimaryColor(c);field("secondaryColor").value=c.secondaryColor||c.branding?.secondaryColor||"#64748b";field("accentColor").value=c.accentColor||c.branding?.accentColor||"#2563eb";field("backgroundColor").value=c.backgroundColor||c.branding?.backgroundColor||"#f8fafc";field("cardColor").value=c.cardColor||c.branding?.cardColor||"#ffffff";field("websiteUrl").value=customerWebsiteUrl(c);field("estimateUrl").value=customerEstimateUrl(c);field("logoUrl").value=customerLogoUrl(c);field("ctaText").value=customerCtaText(c);field("notes").value=c.notes||"";updateHelper();setStatus("");window.scrollTo({top:0,behavior:"smooth"})}
function formPayload(){const companyKey=field("companyKey").value.trim(),companyName=field("companyName").value.trim(),monthlyLimit=Number(field("monthlyLimit").value||0),monthlyPrice=Number(field("monthlyPrice").value||0),plan=field("plan").value,status=field("status").value,phone=field("phone").value.trim(),email=field("email").value.trim(),city=field("city").value.trim(),primaryColor=field("primaryColor").value,secondaryColor=field("secondaryColor").value,accentColor=field("accentColor").value,backgroundColor=field("backgroundColor").value,cardColor=field("cardColor").value,customerPageUrl=field("websiteUrl").value.trim(),estimateUrl=field("estimateUrl").value.trim(),logoUrl=field("logoUrl").value.trim(),buttonText=field("ctaText").value.trim()||"Request an Estimate",notes=field("notes").value.trim();return{companyKey,companyName,monthlyLimit,monthlyPrice,plan,status,phone,email,city,primaryColor,secondaryColor,accentColor,backgroundColor,cardColor,customerPageUrl,websiteUrl:customerPageUrl,estimateUrl,logoUrl,buttonText,ctaText:buttonText,notes,branding:{phone,email,contactEmail:email,city,primaryColor,secondaryColor,accentColor,backgroundColor,cardColor,customerPageUrl,websiteUrl:customerPageUrl,estimateUrl,logoUrl,buttonText,ctaText:buttonText}}}
async function loadCustomers(){setBusy(true);setStatus("Loading...");try{const month=elements.monthInput.value||thisMonth(),stamp=Date.now();const data=await api(`/api/admin/customers?month=${encodeURIComponent(month)}&_=${stamp}`);state.customers=data.customers||[];render();showAdmin();setStatus("Loaded.")}catch(e){setStatus(e.message,true)}finally{setBusy(false)}}
async function deleteCustomer(companyKey){setBusy(true);setStatus("Deleting customer...");try{await api("/api/admin/customers",{method:"PATCH",body:JSON.stringify({action:"delete",companyKey})});state.customers=state.customers.filter(c=>c.companyKey!==companyKey);renderRows();setStatus("Customer deleted.")}catch(e){setStatus(e.message,true)}finally{setBusy(false)}}
async function saveCustomer(event){event.preventDefault();setBusy(true);setStatus("Saving...");try{const data=await api("/api/admin/customers",{method:state.selectedKey?"PATCH":"POST",body:JSON.stringify(formPayload())});if(data.customer){const withoutSaved=state.customers.filter(c=>c.companyKey!==data.customer.companyKey);state.customers=[...withoutSaved,{...data.customer,usage:data.customer.usage||{used:0}}];render()}resetForm();await loadCustomers();setStatus("Saved.")}catch(e){setStatus(e.message,true)}finally{setBusy(false)}}
async function updateCustomerStatus(companyKey,status){setBusy(true);setStatus(status==="active"?"Activating...":"Deactivating...");try{const data=await api("/api/admin/customers",{method:"PATCH",body:JSON.stringify({companyKey,status})});if(data.customer){state.customers=state.customers.map(c=>c.companyKey===data.customer.companyKey?{...c,...data.customer}:c);render()}await loadCustomers();setStatus(status==="active"?"Activated.":"Deactivated.")}catch(e){setStatus(e.message,true)}finally{setBusy(false)}}
async function archiveSelected(){if(!state.selectedKey)return;if(!window.confirm("Deactivate this customer?"))return;await updateCustomerStatus(state.selectedKey,"archived");resetForm()}async function resetUsage(companyKey){if(!window.confirm(`Reset usage for ${companyKey}?`))return;setBusy(true);setStatus("Resetting usage...");try{await api("/api/admin/usage",{method:"POST",body:JSON.stringify({action:"reset",companyKey,month:elements.monthInput.value||thisMonth()})});await loadCustomers();setStatus("Usage reset.")}catch(e){setStatus(e.message,true)}finally{setBusy(false)}}
elements.monthInput.value=thisMonth();field("plan").value="Trial";field("monthlyPrice").value="199";field("ctaText").value="Request an Estimate";updateHelper();elements.loginForm.addEventListener("submit",e=>{e.preventDefault();const v=elements.adminTokenInput.value.trim();if(v!==state.token){showLogin("Wrong admin API token.");return}showAdmin();loadCustomers()});elements.refreshButton.addEventListener("click",loadCustomers);elements.monthInput.addEventListener("change",loadCustomers);elements.searchInput.addEventListener("input",renderRows);elements.statusFilter.addEventListener("change",renderRows);elements.newButton.addEventListener("click",resetForm);elements.customerForm.addEventListener("submit",saveCustomer);elements.archiveButton.addEventListener("click",archiveSelected);field("companyKey").addEventListener("input",updateHelper);elements.copyEditorKeyButton.addEventListener("click",()=>copyText(field("companyKey").value.trim(),"Customer key copied."));elements.copyEditorLeadButton.addEventListener("click",()=>copyText(embedSnippet(field("companyKey").value.trim(),"lead"),"Lead visualizer embed copied."));elements.copyEditorShowroomButton.addEventListener("click",()=>copyText(embedSnippet(field("companyKey").value.trim(),"showroom"),"Showroom visualizer embed copied."));elements.customerRows.addEventListener("click",event=>{const button=event.target.closest("button[data-action]");if(!button)return;const companyKey=button.getAttribute("data-key"),action=button.getAttribute("data-action");if(action==="copy-key")copyText(companyKey,"Customer key copied.");if(action==="copy-lead")copyText(embedSnippet(companyKey,"lead"),"Lead visualizer embed copied.");if(action==="copy-showroom")copyText(embedSnippet(companyKey,"showroom"),"Showroom visualizer embed copied.");if(action==="open-page")window.open(button.getAttribute("data-url"),"_blank","noopener");if(action==="edit")editCustomer(companyKey);if(action==="reset")resetUsage(companyKey);if(action==="deactivate"&&window.confirm(`Deactivate ${companyKey}?`))updateCustomerStatus(companyKey,"archived");if(action==="activate")updateCustomerStatus(companyKey,"active");if(action==="delete"&&window.confirm(`Permanently delete ${companyKey}? This cannot be undone.`))deleteCustomer(companyKey)});loadCustomers();
</script>
