<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabinet Visualizer Admin</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;color:#172033;background:#f5f7fb}.boot{width:min(560px,calc(100vw - 32px));background:#fff;border:1px solid #d9dee8;border-radius:14px;box-shadow:0 10px 30px rgba(23,32,51,.08);padding:22px}.boot h1{margin:0 0 8px;font-size:24px}.boot p{margin:0;color:#647084;line-height:1.5}
</style>
</head>
<body>
<div class="boot"><h1>Loading admin...</h1><p>Create Customer, Catalog Manager, and Temporary Demo Access will load as separate admin cards.</p></div>
<script>
const ADMIN_SOURCE='https://raw.githubusercontent.com/jcabinetry/kitchen-visualizer-api/5fef209fd27b1d7906408b9258124637fe58eb6a/admin.html';
const EXTRA_CSS='.admin-side{display:grid;gap:16px;align-self:start}.admin-extra-card{padding:16px;display:grid;gap:12px}.admin-extra-card p{margin:0;color:var(--muted);line-height:1.5}.demo-access-grid{display:grid;grid-template-columns:1fr;gap:10px}.demo-tools{display:grid;gap:10px;padding-top:12px;border-top:1px solid var(--line)}.demo-tool-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.demo-access-result{display:none;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;line-height:1.55}.demo-access-result.active{display:block}.demo-pin-value{font-size:30px;font-weight:950;letter-spacing:.08em;color:var(--green)}.demo-pin-list{display:grid;gap:8px}.demo-pin-row{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;display:grid;gap:8px}.demo-pin-row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.demo-pin-row strong{font-size:20px;letter-spacing:.06em;color:var(--green)}.demo-pin-row span{display:block;color:var(--muted);font-size:12px;line-height:1.45}.demo-pin-status{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;background:#eef1f6;color:#384152}.demo-pin-status.active{background:#e8f8ef;color:#14783e}.demo-pin-status.inactive{background:#fff4df;color:#9a5b00}.demo-pin-row-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.danger-action{background:#fff0ee!important;color:#b42318!important;border:1px solid #ffd3cc!important}.catalog-modal{display:none;position:fixed;inset:0;z-index:100000;background:rgba(15,23,42,.62);padding:18px}.catalog-modal.active{display:block}.catalog-modal-shell{height:100%;max-width:1160px;margin:auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)}.catalog-modal-close{float:right;margin:10px;border:0;border-radius:10px;background:#fff0ee;color:#b42318;padding:10px 14px;font-weight:900}.catalog-modal iframe{width:100%;height:100%;border:0}@media(max-width:980px){.layout>.admin-side{order:-1;width:100%}}@media(max-width:760px){.demo-tool-actions,.demo-pin-row-actions{grid-template-columns:1fr}}';
const CATALOG_CARD='<aside class="panel catalog-manager-panel"><div class="panel-header"><h2>Catalog Manager</h2></div><section class="admin-extra-card"><p>Open the manufacturer catalog manager without leaving this admin dashboard.</p><button class="primary" id="cvCatBtn" type="button">Open Catalog Manager</button></section></aside>';
const DEMO_CARD='<aside class="panel demo-access-panel"><div class="panel-header"><h2>Temporary Demo Access</h2></div><section class="admin-extra-card"><p>Generate one temporary PIN that unlocks all demo visualizer pages.</p><div class="demo-access-grid"><label>Company / Customer Name<input id="demoCompanyName" placeholder="Example Cabinet Co"></label><label>Duration<select id="demoDuration"><option value="24">24 hours</option><option value="48">48 hours</option><option value="72">72 hours</option><option value="168">7 days</option><option value="336">14 days</option><option value="720">30 days</option></select></label></div><button class="primary" id="generateDemoPinButton" type="button">Generate Demo PIN</button><div id="demoPinResult" class="demo-access-result"><div>PIN</div><div id="demoPinValue" class="demo-pin-value"></div><div><strong>Company:</strong> <span id="demoPinCompany"></span></div><div><strong>Access:</strong> All demo visualizers</div><div><strong>Expiration:</strong> <span id="demoPinExpires"></span></div><div class="helper-actions"><button class="neutral" id="copyDemoPinButton" type="button">Copy PIN</button><button class="link-button" id="copyDemoInstructionsButton" type="button">Copy demo instructions</button></div></div><div class="demo-tools"><div class="demo-pin-row-top"><p><strong>Demo PINs</strong></p><button class="neutral" id="refreshDemoPinsButton" type="button">Refresh</button></div><div id="activeDemoPins" class="demo-pin-list"><p>Loading demo PINs...</p></div></div><div class="demo-tools"><p><strong>Manage demo code</strong></p><label>Demo PIN<input id="manageDemoPin" placeholder="Enter PIN to manage"></label><div class="demo-tool-actions"><button class="neutral" id="deactivateDemoPinButton" type="button">Deactivate</button><button class="neutral" id="reactivateDemoPinButton" type="button">Reactivate</button><button class="danger-action" id="deleteDemoPinButton" type="button">Delete</button></div></div><div class="demo-tools"><p><strong>Delete customer</strong></p><label>Customer Key<input id="deleteCustomerKey" placeholder="company-key"></label><button class="danger-action" id="deleteCustomerButton" type="button">Delete Customer</button></div></section></aside>';
const CATALOG_MODAL='<div id="cvCatModal" class="catalog-modal"><div class="catalog-modal-shell"><button id="cvCatClose" class="catalog-modal-close" type="button">Close</button><iframe src="/catalog-dashboard-v2.html"></iframe></div></div>';
const ELEMENTS_PATCH='customerCatalogList:document.getElementById("customerCatalogList"),demoCompanyName:document.getElementById("demoCompanyName"),demoDuration:document.getElementById("demoDuration"),generateDemoPinButton:document.getElementById("generateDemoPinButton"),demoPinResult:document.getElementById("demoPinResult"),demoPinValue:document.getElementById("demoPinValue"),demoPinCompany:document.getElementById("demoPinCompany"),demoPinExpires:document.getElementById("demoPinExpires"),copyDemoPinButton:document.getElementById("copyDemoPinButton"),copyDemoInstructionsButton:document.getElementById("copyDemoInstructionsButton"),activeDemoPins:document.getElementById("activeDemoPins"),refreshDemoPinsButton:document.getElementById("refreshDemoPinsButton"),manageDemoPin:document.getElementById("manageDemoPin"),deactivateDemoPinButton:document.getElementById("deactivateDemoPinButton"),reactivateDemoPinButton:document.getElementById("reactivateDemoPinButton"),deleteDemoPinButton:document.getElementById("deleteDemoPinButton"),deleteCustomerKey:document.getElementById("deleteCustomerKey"),deleteCustomerButton:document.getElementById("deleteCustomerButton")};';
const DEMO_JS='let latestDemoPin=null;function demoPageUrl(page){return new URL(page,window.location.href).href}function demoInstructions(record){return "Temporary demo PIN: "+record.pin+"\\nCompany: "+(record.companyName||"Demo customer")+"\\nDemo links page: "+demoPageUrl("demo-links.html")+"\\nExpires: "+new Date(record.expiresAt).toLocaleString()+"\\n\\nOpen the demo links page, choose any demo visualizer, then enter this PIN."}function renderDemoPins(records){if(!elements.activeDemoPins)return;if(!records.length){elements.activeDemoPins.innerHTML="<p>No demo PINs yet.</p>";return}elements.activeDemoPins.innerHTML=records.map(record=>{const status=record.status||"active";const action=status==="active"?"deactivate":"reactivate";const label=status==="active"?"Deactivate":"Reactivate";return "<div class=\\"demo-pin-row\\"><div class=\\"demo-pin-row-top\\"><div><strong>"+record.pin+"</strong><span>"+(record.companyName||"Demo customer")+"</span><span>Expires "+new Date(record.expiresAt).toLocaleString()+"</span></div><div class=\\"demo-pin-status "+status+"\\">"+status.toUpperCase()+"</div></div><div class=\\"demo-pin-row-actions\\"><button class=\\"neutral\\" type=\\"button\\" data-demo-action=\\""+action+"\\" data-pin=\\""+record.pin+"\\">"+label+"</button><button class=\\"danger-action\\" type=\\"button\\" data-demo-action=\\"delete\\" data-pin=\\""+record.pin+"\\">Delete</button></div></div>"}).join("")}async function loadDemoPins(){if(!elements.activeDemoPins)return;try{const data=await api("/api/admin/demo-pins");renderDemoPins(data.demoPins||[])}catch(e){elements.activeDemoPins.innerHTML="<p>Could not load demo PINs.</p>"}}async function generateDemoPin(){setBusy(true);setStatus("Generating demo PIN...");try{const data=await api("/api/admin/demo-pins",{method:"POST",body:JSON.stringify({companyName:elements.demoCompanyName.value.trim(),durationHours:Number(elements.demoDuration.value)})});latestDemoPin=data.demoPin;elements.demoPinValue.textContent=latestDemoPin.pin;elements.demoPinCompany.textContent=latestDemoPin.companyName||"Demo customer";elements.demoPinExpires.textContent=new Date(latestDemoPin.expiresAt).toLocaleString();elements.demoPinResult.classList.add("active");elements.manageDemoPin.value=latestDemoPin.pin;setStatus("Demo PIN generated for all demo visualizers.");loadDemoPins()}catch(e){setStatus(e.message,true)}finally{setBusy(false)}}async function setDemoPinStatus(pinValue,action){const pin=(pinValue||elements.manageDemoPin.value).trim();if(!pin){setStatus("Enter a demo PIN to manage.",true);return}setBusy(true);setStatus((action==="reactivate"?"Reactivating":"Deactivating")+" demo PIN...");try{await api("/api/admin/demo-pins",{method:"PATCH",body:JSON.stringify({action,pin})});setStatus(action==="reactivate"?"Demo PIN reactivated.":"Demo PIN deactivated.");loadDemoPins()}catch(e){setStatus(e.message,true)}finally{setBusy(false)}}async function deleteDemoPin(pinValue){const pin=(pinValue||elements.manageDemoPin.value).trim();if(!pin){setStatus("Enter a demo PIN to delete.",true);return}if(!confirm("Delete demo PIN "+pin+"?"))return;setBusy(true);setStatus("Deleting demo PIN...");try{await api("/api/admin/demo-pins",{method:"DELETE",body:JSON.stringify({pin})});if(latestDemoPin&&latestDemoPin.pin===pin){latestDemoPin=null;elements.demoPinResult.classList.remove("active")}if(elements.manageDemoPin.value.trim()===pin)elements.manageDemoPin.value="";setStatus("Demo PIN deleted.");loadDemoPins()}catch(e){setStatus(e.message,true)}finally{setBusy(false)}}async function deleteCustomerFromAdmin(){const companyKey=elements.deleteCustomerKey.value.trim();if(!companyKey){setStatus("Enter a customer key to delete.",true);return}if(!confirm("Delete customer "+companyKey+"? This removes the customer and usage records."))return;setBusy(true);setStatus("Deleting customer...");try{await api("/api/admin/customers",{method:"PATCH",body:JSON.stringify({action:"delete",companyKey})});elements.deleteCustomerKey.value="";setStatus("Customer deleted.");if(typeof loadCustomers==="function")loadCustomers()}catch(e){setStatus(e.message,true)}finally{setBusy(false)}}';
const EXTRA_EVENTS='elements.copyEditorCustomButton.addEventListener("click",()=>copyText(embedSnippet(field("companyKey").value.trim(),"custom"),"Custom visualizer embed copied."));elements.generateDemoPinButton.addEventListener("click",generateDemoPin);elements.copyDemoPinButton.addEventListener("click",()=>latestDemoPin&&copyText(latestDemoPin.pin,"Demo PIN copied."));elements.copyDemoInstructionsButton.addEventListener("click",()=>latestDemoPin&&copyText(demoInstructions(latestDemoPin),"Demo instructions copied."));elements.deactivateDemoPinButton.addEventListener("click",()=>setDemoPinStatus("","deactivate"));elements.reactivateDemoPinButton.addEventListener("click",()=>setDemoPinStatus("","reactivate"));elements.deleteDemoPinButton.addEventListener("click",()=>deleteDemoPin());elements.deleteCustomerButton.addEventListener("click",deleteCustomerFromAdmin);elements.refreshDemoPinsButton.addEventListener("click",loadDemoPins);elements.activeDemoPins.addEventListener("click",event=>{const button=event.target.closest("button[data-demo-action]");if(!button)return;const pin=button.getAttribute("data-pin")||"";const action=button.getAttribute("data-demo-action");if(action==="deactivate"||action==="reactivate")setDemoPinStatus(pin,action);if(action==="delete")deleteDemoPin(pin)});loadDemoPins();function ensureCatalogModal(){let modal=document.getElementById("cvCatModal");if(!modal){document.body.insertAdjacentHTML("beforeend","<div id=\\"cvCatModal\\" class=\\"catalog-modal\\"><div class=\\"catalog-modal-shell\\"><button id=\\"cvCatClose\\" class=\\"catalog-modal-close\\" type=\\"button\\">Close</button><iframe src=\\"/catalog-dashboard-v2.html\\"></iframe></div></div>");modal=document.getElementById("cvCatModal")}const close=document.getElementById("cvCatClose");if(close&&!close.dataset.bound){close.dataset.bound="1";close.addEventListener("click",()=>modal.classList.remove("active"))}return modal}const cvCatBtn=document.getElementById("cvCatBtn");if(cvCatBtn)cvCatBtn.addEventListener("click",()=>ensureCatalogModal().classList.add("active"));ensureCatalogModal();window.addEventListener("message",event=>{if(event.data&&event.data.type==="catalogs-updated"){const refresh=document.getElementById("refreshCatalogsButton");if(refresh)refresh.click();setTimeout(()=>setStatus("Catalog list refreshed."),500)}});';
function patchAdmin(html){
  return html
    .replaceAll('/api/import-catalog','/api/import-catalog-any')
    .replace('.pill{background:#eef1f6;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;color:#384152}\n@media(max-width:1320px)', '.pill{background:#eef1f6;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;color:#384152}'+EXTRA_CSS+'\n@media(max-width:1320px)')
    .replace('<aside class="panel"><div class="panel-header"><h2 id="editorTitle">Create Customer</h2>', '<div class="admin-side"><aside class="panel"><div class="panel-header"><h2 id="editorTitle">Create Customer</h2>')
    .replace('</form><div id="statusLine" class="status-line"></div></aside></section>', '</form><div id="statusLine" class="status-line"></div></aside>'+CATALOG_CARD+DEMO_CARD+'</div></section>')
    .replace('</body>', CATALOG_MODAL+'</body>')
    .replace('customerCatalogList:document.getElementById("customerCatalogList")};', ELEMENTS_PATCH)
    .replace('elements.monthInput.value=thisMonth();', DEMO_JS+'elements.monthInput.value=thisMonth();')
    .replace('elements.copyEditorCustomButton.addEventListener("click",()=>copyText(embedSnippet(field("companyKey").value.trim(),"custom"),"Custom visualizer embed copied."));', EXTRA_EVENTS);
}
fetch(ADMIN_SOURCE,{cache:'no-store'})
  .then(function(response){if(!response.ok)throw new Error('Could not load admin page.');return response.text();})
  .then(function(html){document.open();document.write(patchAdmin(html));document.close();})
  .catch(function(error){document.querySelector('.boot p').textContent='Admin failed to load: '+error.message;});
</script>
</body>
</html>
