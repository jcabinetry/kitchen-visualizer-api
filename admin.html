<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabinet Visualizer Admin</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;color:#172033;background:#f5f7fb}</style>
</head>
<body>
<div>Loading admin...</div>
<script>
const ADMIN_SOURCE="https://raw.githubusercontent.com/jcabinetry/kitchen-visualizer-api/5fef209fd27b1d7906408b9258124637fe58eb6a/admin.html";
const DEMO_CSS='.demo-access-box{margin:16px;border:1px solid var(--line);border-radius:14px;background:#fafbfe;padding:14px;display:grid;gap:12px}.demo-access-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.demo-access-result{display:none;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;line-height:1.55}.demo-access-result.active{display:block}.demo-pin-value{font-size:30px;font-weight:950;letter-spacing:.08em;color:var(--green)}@media(max-width:760px){.demo-access-grid{grid-template-columns:1fr}}';
const DEMO_CARD='<section class="demo-access-box"><div class="section-title">Temporary Demo Access</div><div class="demo-access-grid"><label>Demo Type<select id="demoType"><option value="showroom">Showroom</option><option value="lead">Lead Gen</option><option value="custom">Custom Visualizer</option></select></label><label>Duration<select id="demoDuration"><option value="24">24 hours</option><option value="48">48 hours</option><option value="72">72 hours</option><option value="168">7 days</option><option value="336">14 days</option><option value="720">30 days</option></select></label></div><button class="primary" id="generateDemoPinButton" type="button">Generate Demo PIN</button><div id="demoPinResult" class="demo-access-result"><div>PIN</div><div id="demoPinValue" class="demo-pin-value"></div><div><strong>Demo type:</strong> <span id="demoPinType"></span></div><div><strong>Expiration:</strong> <span id="demoPinExpires"></span></div><div class="helper-actions"><button class="neutral" id="copyDemoPinButton" type="button">Copy PIN</button><button class="link-button" id="copyDemoInstructionsButton" type="button">Copy demo instructions</button></div></div></section>';
const ELEMENTS_PATCH='customerCatalogList:document.getElementById("customerCatalogList"),demoType:document.getElementById("demoType"),demoDuration:document.getElementById("demoDuration"),generateDemoPinButton:document.getElementById("generateDemoPinButton"),demoPinResult:document.getElementById("demoPinResult"),demoPinValue:document.getElementById("demoPinValue"),demoPinType:document.getElementById("demoPinType"),demoPinExpires:document.getElementById("demoPinExpires"),copyDemoPinButton:document.getElementById("copyDemoPinButton"),copyDemoInstructionsButton:document.getElementById("copyDemoInstructionsButton")};';
const DEMO_JS='let latestDemoPin=null;function demoTypeLabel(value){return value==="lead"?"Lead Gen":value==="custom"?"Custom Visualizer":"Showroom"}function demoPageUrl(value){const pages={showroom:"demo-showroom-visualizer.html",lead:"demo-lead-visualizer.html",custom:"demo-custom-visualizer.html"};return new URL(pages[value]||pages.showroom,window.location.href).href}function demoInstructions(record){return "Open "+demoPageUrl(record.demoType)+"\\nEnter temporary PIN: "+record.pin+"\\nDemo type: "+demoTypeLabel(record.demoType)+"\\nExpires: "+new Date(record.expiresAt).toLocaleString()}async function generateDemoPin(){setBusy(true);setStatus("Generating demo PIN...");try{const data=await api("/api/admin/demo-pins",{method:"POST",body:JSON.stringify({demoType:elements.demoType.value,durationHours:Number(elements.demoDuration.value)})});latestDemoPin=data.demoPin;elements.demoPinValue.textContent=latestDemoPin.pin;elements.demoPinType.textContent=demoTypeLabel(latestDemoPin.demoType);elements.demoPinExpires.textContent=new Date(latestDemoPin.expiresAt).toLocaleString();elements.demoPinResult.classList.add("active");setStatus("Demo PIN generated.")}catch(e){setStatus(e.message,true)}finally{setBusy(false)}}';
const DEMO_EVENTS='elements.copyEditorCustomButton.addEventListener("click",()=>copyText(embedSnippet(field("companyKey").value.trim(),"custom"),"Custom visualizer embed copied."));elements.generateDemoPinButton.addEventListener("click",generateDemoPin);elements.copyDemoPinButton.addEventListener("click",()=>latestDemoPin&&copyText(latestDemoPin.pin,"Demo PIN copied."));elements.copyDemoInstructionsButton.addEventListener("click",()=>latestDemoPin&&copyText(demoInstructions(latestDemoPin),"Demo instructions copied."));';
function patchAdmin(html){
  return html
    .replace('.pill{background:#eef1f6;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;color:#384152}\n@media(max-width:1320px)', '.pill{background:#eef1f6;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;color:#384152}'+DEMO_CSS+'\n@media(max-width:1320px)')
    .replace('</form><div id="statusLine" class="status-line"></div></aside>', '</form>'+DEMO_CARD+'<div id="statusLine" class="status-line"></div></aside>')
    .replace('customerCatalogList:document.getElementById("customerCatalogList")};', ELEMENTS_PATCH)
    .replace('elements.monthInput.value=thisMonth();', DEMO_JS+'elements.monthInput.value=thisMonth();')
    .replace('elements.copyEditorCustomButton.addEventListener("click",()=>copyText(embedSnippet(field("companyKey").value.trim(),"custom"),"Custom visualizer embed copied."));', DEMO_EVENTS);
}
fetch(ADMIN_SOURCE,{cache:'no-store'})
  .then(function(response){if(!response.ok)throw new Error('Could not load admin page.');return response.text();})
  .then(function(html){document.open();document.write(patchAdmin(html));document.close();})
  .catch(function(error){document.body.innerHTML='<main style="max-width:520px;padding:24px"><h1>Admin failed to load</h1><p>'+error.message+'</p><p><a href="temporary-demo-access.html">Open Temporary Demo Access</a></p></main>';});
</script>
</body>
</html>
