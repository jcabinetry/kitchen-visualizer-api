<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cabinet Visualizer Admin</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;color:#172033;background:#f5f7fb}.boot{width:min(560px,calc(100vw - 32px));background:#fff;border:1px solid #d9dee8;border-radius:14px;box-shadow:0 10px 30px rgba(23,32,51,.08);padding:22px}.boot h1{margin:0 0 8px;font-size:24px}.boot p{margin:0;color:#647084;line-height:1.5}
</style>
</head>
<body>
<div class="boot"><h1>Loading admin...</h1><p>Create Customer, Catalog Manager, Temporary Demo Access, and Customer Keys will load as separate admin cards.</p></div>
<script>
const ADMIN_WRAPPER_SOURCE='https://raw.githubusercontent.com/jcabinetry/kitchen-visualizer-api/8a79513784285f33d7cdd025de63facd8145fe29/admin.html';
const HIDE_OLD_CATALOG_IMPORT='.catalog-box:has(#catalogLibraryList){display:none!important}';
const FINAL_ADMIN_ENHANCEMENT_PATCH="function patchAdmin(html){\n  return html\n    .replace('</head>','<link rel=\"stylesheet\" href=\"/admin-enhancements.css?v=4\"><link rel=\"stylesheet\" href=\"/admin-compact.css?v=2\"><link rel=\"stylesheet\" href=\"/admin-collapses.css?v=1\"></head>')\n    .replace('</body>','<script src=\"/admin-enhancements.js?v=4\" defer><\\/script><script src=\"/admin-collapses.js?v=1\" defer><\\/script></body>')";
function patchAdminWrapper(html){
  let patched=html;
  if(!patched.includes(HIDE_OLD_CATALOG_IMPORT)){
    patched=patched.replace(
      '.admin-side{display:grid;gap:16px;align-self:start}',
      '.admin-side{display:grid;gap:16px;align-self:start}'+HIDE_OLD_CATALOG_IMPORT
    );
  }
  if(!patched.includes('admin-enhancements.css')){
    patched=patched.replace('function patchAdmin(html){\n  return html',FINAL_ADMIN_ENHANCEMENT_PATCH);
  }
  return patched;
}
fetch(ADMIN_WRAPPER_SOURCE,{cache:'no-store'})
  .then(function(response){if(!response.ok)throw new Error('Could not load admin page.');return response.text();})
  .then(function(html){document.open();document.write(patchAdminWrapper(html));document.close();})
  .catch(function(error){document.querySelector('.boot p').textContent='Admin failed to load: '+error.message;});
</script>
</body>
</html>
