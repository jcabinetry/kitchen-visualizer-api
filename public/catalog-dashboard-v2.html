<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog Manager</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1050px;margin:0 auto;padding:22px}.card{background:#fff;border:1px solid #d9dee8;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(23,32,51,.08)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;font-weight:900;color:#647084;text-transform:uppercase;margin:8px 0 5px}input,button{width:100%;min-height:42px;border-radius:10px;border:1px solid #d9dee8;padding:9px;font:inherit}button{border:0;background:#2457a6;color:white;font-weight:900;cursor:pointer}.danger{background:#fff0ee;color:#b42318}.neutral{background:#eef1f6;color:#172033}.muted{color:#647084;font-size:13px;line-height:1.45}.status{min-height:24px;color:#647084;font-weight:800}.cat{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin:10px 0;background:#fff}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.pill{display:inline-block;border-radius:999px;background:#eef3ff;color:#2457a6;font-size:11px;font-weight:900;padding:5px 8px;margin:4px 4px 0 0}.warn{background:#eef8ff;border:1px solid #bfdbfe;color:#1e3a8a;padding:10px;border-radius:12px;margin-top:8px;font-size:13px}@media(max-width:750px){.grid,.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Manufacturer Catalog Manager</h1><p class="muted">PDF upload only. If normal extraction fails, the app renders high-resolution page images and uses vision extraction.</p><div class="card"><div class="grid"><label>Admin Token<input id="token" type="password" placeholder="Admin token"></label><label>Manufacturer / Catalog Name<input id="name" placeholder="Merillat Classic 2025"></label></div><label>Upload PDF Catalogs<input id="pdfs" type="file" accept="application/pdf" multiple></label><div class="warn">High-res vision fallback renders up to 60 pages per PDF. Door/swatch pictures are still marked for the next crop step.</div><button id="save">Extract Uploaded PDFs</button><div id="msg" class="status"></div></div><div class="card"><div class="row"><h2>Saved Catalogs</h2><button id="refresh" class="neutral">Refresh</button></div><div id="list"></div></div></div><script type="module">import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';let catalogs=[];const $=id=>document.getElementById(id);function notify(){try{parent.postMessage({type:'catalogs-updated'},'*')}catch(e){}}function msg(t,e){$('msg').textContent=t||'';$('msg').style.color=e?'#b42318':'#647084'}async function api(p,o={}){let r=await fetch(p,{...o,cache:'no-store',headers:{'Content-Type':'application/json','X-Admin-Token':$('token').value.trim(),...(o.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(v){return String(v||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function readFile(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(Error('Could not read '+f.name));r.readAsDataURL(f)})}async function getPdfs(){let files=[...$('pdfs').files];if(!files.length)throw Error('Choose one or more PDF files.');if(!$('name').value.trim())throw Error('Manufacturer name required.');let pdfs=[];for(let i=0;i<files.length;i++){if(files[i].type&&files[i].type!=='application/pdf')throw Error(files[i].name+' is not a PDF.');if(files[i].size>12*1024*1024)throw Error(files[i].name+' is too large for direct upload right now. Use a smaller PDF or split it.');msg('Reading PDF '+(i+1)+' of '+files.length+'...');pdfs.push({fileName:files[i].name,fileBase64:await readFile(files[i]),file:files[i]})}return pdfs}async function renderPdfPages(pdfs){let pages=[];for(let i=0;i<pdfs.length;i++){let f=pdfs[i].file;msg('Rendering pages from '+f.name+'...');let doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let max=Math.min(doc.numPages,60);for(let p=1;p<=max;p++){msg('Rendering '+f.name+' page '+p+' of '+max+'...');let page=await doc.getPage(p);let viewport=page.getViewport({scale:2.35});let canvas=document.createElement('canvas');let ctx=canvas.getContext('2d',{alpha:false});canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);await page.render({canvasContext:ctx,viewport}).promise;pages.push({fileName:f.name,pageNumber:p,imageBase64:canvas.toDataURL('image/png')});}}return pages}async function load(){msg('Loading catalogs...');catalogs=(await api('/api/catalogs?_='+Date.now())).catalogs||[];render();msg('Loaded.')}function counts(cat){let doors=0,finishes=0,lines=0;(cat.manufacturers||[]).forEach(m=>(m.lines||[]).forEach(l=>{lines++;doors+=(l.doors||[]).length;finishes+=(l.finishes||[]).length}));return{lines,doors,finishes}}function render(){let box=$('list');if(!catalogs.length){box.innerHTML='<p class="muted">No catalogs saved yet.</p>';return}box.innerHTML='';catalogs.forEach(cat=>{let c=counts(cat);let sources=cat.sourceUrls||[cat.sourceUrl].filter(Boolean);let stats=cat.stats||{};let imagePlan=(cat.extraction?.imagePlan||cat.extraction?.imageExtractionPlan||[]).length;let div=document.createElement('div');div.className='cat';div.innerHTML='<div class="row"><div><h3>'+esc(cat.name||cat.catalogId)+'</h3><div class="muted">'+esc(cat.catalogId)+' • '+c.lines+' lines • '+c.doors+' doors • '+c.finishes+' finishes • engine: '+esc(cat.extraction?.engine||'old')+' • status: '+esc(cat.extraction?.status||cat.status||'active')+'</div><div class="muted">PDF sources: '+(stats.pdfSources||sources.length||0)+' • page images: '+(stats.pageImages||0)+' • image items to crop: '+imagePlan+'</div><div>'+sources.map((s,i)=>'<span class="pill">PDF '+(i+1)+'</span>').join('')+'</div></div><button class="danger" data-del="'+esc(cat.catalogId)+'">Delete</button></div>';box.appendChild(div)})}async function save(){let pdfs=await getPdfs();try{msg('Trying PDF file/text extraction...');await api('/api/extract-catalog-upload',{method:'POST',body:JSON.stringify({name:$('name').value.trim(),pdfs:pdfs.map(p=>({fileName:p.fileName,fileBase64:p.fileBase64}))})})}catch(e){msg('Text extraction failed. Rendering high-res page images...');let pages=await renderPdfPages(pdfs);msg('Sending '+pages.length+' page images to vision extractor...');await api('/api/extract-catalog-pages',{method:'POST',body:JSON.stringify({name:$('name').value.trim(),pages})})}$('pdfs').value='';await load();notify();msg('Extraction complete. Door/swatch images are marked for next image-cropping step.')}async function del(id){if(!confirm('Delete catalog '+id+'?'))return;await api('/api/catalogs?catalogId='+encodeURIComponent(id),{method:'DELETE'});await load();notify();msg('Catalog deleted.')}document.getElementById('save').onclick=()=>save().catch(e=>msg(e.message,true));document.getElementById('refresh').onclick=()=>load().catch(e=>msg(e.message,true));document.getElementById('list').onclick=e=>{let b=e.target.closest('button[data-del]');if(b)del(b.dataset.del).catch(err=>msg(err.message,true))};msg('Enter admin token, choose one or more PDFs, then extract.');</script></body></html>
