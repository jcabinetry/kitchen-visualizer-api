<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Cabinet Visualizer</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#111827;}
    .loader{max-width:720px;margin:80px auto;padding:30px;text-align:center;background:white;border-radius:22px;box-shadow:0 20px 60px rgba(15,23,42,.12);}
  </style>
</head>
<body>
  <div class="loader">
    <h2>Loading Custom Cabinet Visualizer...</h2>
    <p>Loading the catalog-enabled visualizer.</p>
  </div>

  <script>
    const cacheBust = Date.now();
    fetch("https://raw.githubusercontent.com/jcabinetry/kitchen-visualizer-api/main/custom-visualizer.html?ts=" + cacheBust, { cache: "no-store" })
      .then(function(response) {
        if (!response.ok) throw new Error("Could not load custom visualizer.");
        return response.text();
      })
      .then(function(html) {
        html = html.replace('src="custom-catalogs.js"', 'src="custom-catalogs.js?v=' + cacheBust + '"');
        html = html.replaceAll("https://kitchen-visualizer-api.vercel.app/api/generate", "https://kitchen-visualizer-api.vercel.app/api/generate-catalog");
        html = html.replaceAll("Change cabinet finishes only.", "Change the selected cabinet finish colors, selected catalog door style, countertops, backsplash, and flooring according to the selected options.");
        html = html.replaceAll("This is a refacing-style visualization, not a remodel.", "This is a catalog-based design visualization. Apply every selected option that the customer chose.");
        html = html.replace(
          "body: JSON.stringify({\n          image: uploadedImageData,",
          "body: JSON.stringify({\n          image: uploadedImageData,\n          catalogDoorReference: (document.querySelector(\".jcr-door-option.active .jcr-door-preview img\") || {}).src || null,\n          catalogDoorName: (document.querySelector(\".jcr-door-option.active .jcr-door-name\") || {}).textContent || null,"
        );
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function(error) {
        document.body.innerHTML = '<div class="loader"><h2>Could not load custom visualizer</h2><p>' + error.message + '</p></div>';
      });
  </script>
</body>
</html>
