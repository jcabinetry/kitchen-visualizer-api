<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Cabinet Visualizer</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#111827;}
    .loader{max-width:720px;margin:80px auto;padding:30px;text-align:center;background:white;border-radius:22px;box-shadow:0 20px 60px rgba(15,23,42,.12);}
  </style>
</head>
<body>
  <div class="loader">
    <h2>Loading Custom Cabinet Visualizer...</h2>
    <p>This test page is connected to the custom catalog development file.</p>
  </div>

  <script>
    fetch("https://raw.githubusercontent.com/jcabinetry/kitchen-visualizer-api/main/custom-visualizer.html?ts=" + Date.now(), { cache: "no-store" })
      .then(function(response) {
        if (!response.ok) throw new Error("Could not load custom visualizer.");
        return response.text();
      })
      .then(function(html) {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function(error) {
        document.body.innerHTML = '<div class="loader"><h2>Could not load custom visualizer</h2><p>' + error.message + '</p></div>';
      });
  </script>
</body>
</html>
