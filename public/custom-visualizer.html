<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Cabinet Visualizer</title>
  <style>
    body{margin:0;font-family:Arial,sans-serif;background:#f8fafc;color:#111827;}
    .loader{max-width:720px;margin:80px auto;padding:30px;text-align:center;background:white;border-radius:22px;box-shadow:0 20px 60px rgba(15,23,42,.12);}
  </style>
</head>
<body>
  <div class="loader">
    <h2>Loading Custom Cabinet Visualizer...</h2>
    <p>Loading the catalog-enabled visualizer.</p>
  </div>

  <script>
    const cacheBust = Date.now();
    const runtimePatch = `
<script>
(function(){
  if (window.__directCatalogRequestPatch) return;
  window.__directCatalogRequestPatch = true;

  function cssImageUrl(value) {
    const raw = String(value || "").trim();
    const match = raw.match(/^url\\(["']?(.*?)["']?\\)$/i);
    return match ? match[1] : "";
  }

  function activeDoorImage() {
    const img = document.querySelector(".jcr-door-option.active .jcr-door-preview img");
    return img && img.src ? img.src : "";
  }

  function activeDoorName() {
    const name = document.querySelector(".jcr-door-option.active .jcr-door-name");
    return name ? name.textContent.trim() : "";
  }

  function catalogData() {
    try {
      if (typeof KV_COMPANY !== "undefined" && KV_COMPANY.catalog && KV_COMPANY.catalog.manufacturers) return KV_COMPANY.catalog;
    } catch (_error) {}
    return (window.CV_CUSTOM_CATALOGS && window.CV_CUSTOM_CATALOGS.defaultCatalog) || { manufacturers: [] };
  }

  function selectedSwatchLabel(selectId) {
    const activeLabel = document.querySelector('.jcr-swatch.active[data-select="' + selectId + '"] span')?.textContent?.trim();
    if (activeLabel) return activeLabel;
    const select = document.getElementById(selectId);
    return select && select.options[select.selectedIndex] ? select.options[select.selectedIndex].textContent.trim() : "";
  }

  function selectedSwatch(selectId) {
    const active = document.querySelector('.jcr-swatch.active[data-select="' + selectId + '"] .jcr-dot');
    if (active) {
      const inlineImage = cssImageUrl(active.style.backgroundImage);
      if (inlineImage) return inlineImage;
      const computedImage = cssImageUrl(getComputedStyle(active).backgroundImage);
      if (computedImage) return computedImage;
    }
    const label = selectedSwatchLabel(selectId);
    const catalog = catalogData();
    let found = "";
    (catalog.manufacturers || []).forEach(function(manufacturer) {
      (manufacturer.lines || []).forEach(function(line) {
        (line.finishes || []).forEach(function(finish) {
          const finishLabel = String(finish.label || finish.name || "").trim();
          if (!found && label && finishLabel.toLowerCase() === label.toLowerCase()) found = finish.swatch || finish.image || finish.thumbnail || "";
        });
      });
    });
    return found;
  }

  const originalFetch = window.fetch.bind(window);
  window.fetch = function(input, init) {
    try {
      const url = typeof input === "string" ? input : input && input.url ? input.url : "";
      if (url.includes("/api/generate") && init && typeof init.body === "string") {
        const body = JSON.parse(init.body);
        const doorImage = activeDoorImage();
        const doorName = activeDoorName();
        const upperSwatch = selectedSwatch("jcr_color");
        const baseSwatch = selectedSwatch("jcr_island") || upperSwatch;
        const upperName = selectedSwatchLabel("jcr_color");
        const baseSelect = document.getElementById("jcr_island");
        const baseName = baseSelect && baseSelect.value === "" ? upperName : (selectedSwatchLabel("jcr_island") || upperName);
        const refs = Array.isArray(body.referenceImages) ? body.referenceImages.filter(Boolean) : [];
        if (doorImage) refs.unshift(doorImage);
        if (upperSwatch) refs.unshift(upperSwatch);
        if (baseSwatch && baseSwatch !== upperSwatch) refs.unshift(baseSwatch);
        body.referenceImages = Array.from(new Set(refs)).slice(0, 8);
        body.catalogDoorReference = doorImage || body.catalogDoorReference || null;
        body.catalogDoorName = doorName || body.catalogDoorName || "";
        body.mainCustomReference = upperSwatch || body.mainCustomReference || null;
        body.islandCustomReference = baseSwatch || body.islandCustomReference || upperSwatch || null;
        body.upperSwatchName = upperName || body.upperSwatchName || "";
        body.baseSwatchName = baseName || body.baseSwatchName || upperName || "";
        init = Object.assign({}, init, { body: JSON.stringify(body) });
      }
    } catch (_error) {}
    return originalFetch(input, init);
  };
})();
<\/script>
`;

    fetch("https://raw.githubusercontent.com/jcabinetry/kitchen-visualizer-api/main/custom-visualizer.html?ts=" + cacheBust, { cache: "no-store" })
      .then(function(response) {
        if (!response.ok) throw new Error("Could not load custom visualizer.");
        return response.text();
      })
      .then(function(html) {
        html = html.replace('src="custom-catalogs.js"', 'src="custom-catalogs.js?v=' + cacheBust + '"');
        html = html.replaceAll("https://kitchen-visualizer-api.vercel.app/api/generate", "https://kitchen-visualizer-api.vercel.app/api/generate-catalog");
        html = html.replaceAll("Change cabinet finishes only.", "Change the selected cabinet finish colors, selected catalog door style, countertops, backsplash, and flooring according to the selected options.");
        html = html.replaceAll("This is a refacing-style visualization, not a remodel.", "This is a catalog-based design visualization. Apply every selected option that the customer chose.");
        html = html + runtimePatch;
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function(error) {
        document.body.innerHTML = '<div class="loader"><h2>Could not load custom visualizer</h2><p>' + error.message + '</p></div>';
      });
  </script>
</body>
</html>
