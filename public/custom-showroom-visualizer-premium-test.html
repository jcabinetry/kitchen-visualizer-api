  function enhanceLightbox(){
    const lightbox = qs("#kv_lead_lightbox");
    const lightboxImg = qs("#kv_lead_lightbox_img");
    const close = qs("#kv_lead_lightbox_close");
    if(!lightbox || !lightboxImg || lightbox.dataset.ready === "1") return;
    lightbox.dataset.ready = "1";
    let last = null;
    function open(src, alt, trigger){
      if(!src) return;
      last = trigger || document.activeElement;
      lightboxImg.src = src;
      lightboxImg.alt = alt || "Expanded design preview";
      lightbox.classList.add("active");
      lightbox.setAttribute("aria-hidden","false");
      document.body.style.overflow = "hidden";
      if(close) close.focus({preventScroll:true});
    }
    function shut(){
      lightbox.classList.remove("active");
      lightbox.setAttribute("aria-hidden","true");
      lightboxImg.src = "";
      document.body.style.overflow = "";
      if(last && typeof last.focus === "function") last.focus({preventScroll:true});
      last = null;
    }
    ["jcr_before_img","jcr_after_img","jcr_design_a_img","jcr_design_b_img"].forEach(function(id){
      const img = document.getElementById(id);
      if(!img || img.dataset.lightboxReady === "1") return;
      img.dataset.lightboxReady = "1";
      img.setAttribute("tabindex","0");
      img.setAttribute("role","button");
      img.addEventListener("click", function(e){ e.stopPropagation(); open(img.src, img.alt, img); });
      img.addEventListener("keydown", function(e){ if((e.key === "Enter" || e.key === " ") && img.src){ e.preventDefault(); open(img.src, img.alt, img); } });
    });
    if(close) close.addEventListener("click", shut);
    lightbox.addEventListener("click", function(e){ if(e.target === lightbox) shut(); });
    document.addEventListener("keydown", function(e){ if(lightbox.classList.contains("active") && e.key === "Escape") shut(); });
