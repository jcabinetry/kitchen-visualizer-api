<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cabinet Visualizer V2 Test</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;font-family:Arial,sans-serif;color:#111827}
    .box{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:28px;box-shadow:0 18px 45px rgba(15,23,42,.10);max-width:560px;text-align:center}
  </style>
</head>
<body>
  <div class="box">Loading showroom visualizer V2 test...</div>
  <script>
    fetch("https://raw.githubusercontent.com/jcabinetry/kitchen-visualizer-api/main/public/showroom-visualizer.html?v=" + Date.now(), { cache: "no-store" })
      .then(function(response){
        if(!response.ok) throw new Error("Could not load showroom file");
        return response.text();
      })
      .then(function(html){
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function(error){
        document.body.innerHTML = '<div class="box"><h1>Visualizer loading error</h1><p>' + error.message + '</p></div>';
      });
  </script>
</body>
</html>
