<div id="cvShowroomLoader" style="max-width:680px;margin:60px auto;padding:28px;border-radius:18px;background:#fff;border:1px solid #e5e7eb;box-shadow:0 18px 45px rgba(15,23,42,.10);font-family:Arial,sans-serif;color:#111827;text-align:center;">Loading showroom visualizer...</div>
<script>
(async function(){
  const sourceUrl = "https://raw.githubusercontent.com/jcabinetry/kitchen-visualizer-api/78356885fe2780fea70295407699a1571c5e6a48/public/showroom-visualizer.html";
  const premiumStyles = `
/* Premium branded showroom polish - style only */
.kv-wrap{
  background:
    radial-gradient(circle at top left,color-mix(in srgb,var(--kv-primary,#1f2937) 13%,transparent),transparent 34%),
    radial-gradient(circle at top right,color-mix(in srgb,var(--kv-accent,#2563eb) 12%,transparent),transparent 30%),
    linear-gradient(180deg,var(--kv-card,#ffffff),var(--kv-background,#f8fafc))!important;
  border-color:color-mix(in srgb,var(--kv-secondary,#64748b) 24%,#e5e7eb)!important;
}
.kv-hero-card{
  max-width:1100px;
  margin:0 auto 28px;
  padding:30px 28px 34px;
  border-radius:30px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--kv-card,#ffffff) 92%,white),color-mix(in srgb,var(--kv-background,#f8fafc) 78%,white));
  border:1px solid color-mix(in srgb,var(--kv-secondary,#64748b) 20%,transparent);
  box-shadow:0 24px 70px rgba(15,23,42,.10);
}
#kv_logo{max-height:120px;object-fit:contain;filter:drop-shadow(0 12px 22px rgba(15,23,42,.10));}
#kv_title{color:var(--kv-primary,#111827)!important;text-wrap:balance;}
#kv_subtitle{color:color-mix(in srgb,var(--kv-secondary,#64748b) 78%,#111827)!important;}
#kv_phone{color:var(--kv-primary,#1f2937)!important;}
.jcr-card,.jcr-design-compare-box,.jcr-selected-summary,.jcr-ai-panel{
  background:linear-gradient(180deg,color-mix(in srgb,var(--kv-card,#ffffff) 96%,white),color-mix(in srgb,var(--kv-card,#ffffff) 88%,var(--kv-background,#f8fafc)))!important;
  border-color:color-mix(in srgb,var(--kv-secondary,#64748b) 22%,#e5e7eb)!important;
  box-shadow:0 22px 60px rgba(15,23,42,.10)!important;
}
.jcr-card{border-radius:28px!important;}
.jcr-card label,.jcr-door-name,.jcr-selected-summary h3,.jcr-result-title h3,.jcr-design-compare-box h3{color:color-mix(in srgb,var(--kv-primary,#111827) 86%,#111827)!important;}
.jcr-section-note,.jcr-door-desc,.jcr-result-title p,.jcr-success-copy,.jcr-selected-label,.jcr-design-compare-card p{color:color-mix(in srgb,var(--kv-secondary,#64748b) 82%,#6b7280)!important;}
.jcr-upload-box,.jcr-door-option,.jcr-material,.jcr-swatch,.jcr-selected-item,.jcr-design-compare-card,.jcr-ai-step,.jcr-client-box{
  background:linear-gradient(180deg,color-mix(in srgb,var(--kv-card,#ffffff) 96%,white),color-mix(in srgb,var(--kv-background,#f8fafc) 58%,white))!important;
  border-color:color-mix(in srgb,var(--kv-secondary,#64748b) 22%,#e5e7eb)!important;
}
.jcr-upload-box:hover,.jcr-door-option:hover,.jcr-material:hover,.jcr-swatch:hover{border-color:var(--kv-primary,#1f2937)!important;box-shadow:0 24px 54px color-mix(in srgb,var(--kv-primary,#1f2937) 18%,transparent)!important;}
.jcr-swatch.active,.jcr-material.active,.jcr-door-option.active{border-color:var(--kv-primary,#1f2937)!important;box-shadow:0 24px 58px color-mix(in srgb,var(--kv-primary,#1f2937) 24%,transparent)!important;}
.jcr-door-option.active::after,.jcr-upload-icon,.jcr-btn-primary,.jcr-cta-link,.jcr-loading-fill{background:linear-gradient(135deg,var(--kv-primary,#1f2937),var(--kv-accent,#2563eb))!important;}
.jcr-btn-primary,.jcr-cta-link{box-shadow:0 22px 50px color-mix(in srgb,var(--kv-primary,#1f2937) 28%,transparent)!important;}
.jcr-btn-primary:hover,.jcr-cta-link:hover{box-shadow:0 30px 70px color-mix(in srgb,var(--kv-primary,#1f2937) 34%,transparent)!important;}
.jcr-btn-dark,.jcr-client-close,.jcr-btn-light{background:color-mix(in srgb,var(--kv-primary,#111827) 90%,#111827)!important;color:#fff!important;}
.jcr-card input,.jcr-card select,.jcr-card textarea,.jcr-client-field input,.jcr-client-field textarea{background:color-mix(in srgb,var(--kv-card,#ffffff) 96%,white)!important;border-color:color-mix(in srgb,var(--kv-secondary,#64748b) 28%,#d1d5db)!important;}
.jcr-file-name,.jcr-selected-value,.jcr-design-compare-card strong{color:var(--kv-primary,#1f2937)!important;}
.jcr-compare{border-color:color-mix(in srgb,var(--kv-secondary,#64748b) 26%,rgba(255,255,255,.18))!important;box-shadow:0 34px 90px rgba(15,23,42,.26)!important;}
/* Keep KPM branding always blue */
.mobile-powered-fixed strong,.mobile-powered strong,.cv-powered strong{color:#0b4f9c!important;font-weight:900!important;}
.mobile-kpm-small,.mobile-powered .mobile-kpm,.cv-powered .kpm{background:#0b4f9c!important;}
@media(max-width:600px){.kv-hero-card{padding:22px 16px 24px;border-radius:22px;margin-bottom:18px;}}
`;
  try{
    const response = await fetch(sourceUrl,{cache:"no-store"});
    if(!response.ok) throw new Error("Could not load showroom file");
    let html = await response.text();
    html = html.replace("</style>", premiumStyles + "\n</style>");
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML = '<div style="max-width:680px;margin:60px auto;padding:28px;border-radius:18px;background:#fff;border:1px solid #fecaca;font-family:Arial,sans-serif;color:#991b1b;">Showroom loading error: '+error.message+'</div>';
  }
})();
</script>
