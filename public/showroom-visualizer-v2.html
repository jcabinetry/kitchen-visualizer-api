<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabinet Visualizer V2</title>
<style>body{margin:0;background:#f8fafc;font-family:Arial,sans-serif;color:#111827}.box{min-height:100vh;display:grid;place-items:center}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:28px;box-shadow:0 18px 45px rgba(15,23,42,.10);max-width:560px;text-align:center}</style>
</head>
<body>
<div class="box"><div class="card">Loading showroom visualizer...</div></div>
<script>
fetch('/showroom-visualizer.html' + window.location.search, {cache:'no-store'})
  .then(function(r){return r.text();})
  .then(function(html){document.open();document.write(html);document.close();})
  .catch(function(){document.body.innerHTML='<div class="box"><div class="card">Could not load visualizer.</div></div>';});
</script>
</body>
</html>
