<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generation Inspector</title>
<style>
:root{--bg:#eef4fb;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#dbe5f1;--primary:#1d4ed8;--danger:#b91c1c;--shadow:0 18px 50px rgba(15,23,42,.10)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
.wrap{width:min(1500px,calc(100% - 32px));margin:28px auto 60px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}
h1{margin:0;font-size:clamp(30px,4vw,46px);letter-spacing:0;line-height:1}
p{color:var(--muted);line-height:1.5}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:18px}
.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
label{display:grid;gap:6px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:#334155}
input,select,button,textarea{font:inherit}
input,select{min-height:44px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:#fff;color:var(--text)}
button{min-height:44px;border:0;border-radius:12px;padding:10px 14px;font-weight:900;cursor:pointer}
.primary{background:var(--primary);color:#fff}
.secondary{background:#eaf0f8;color:#0f172a;border:1px solid var(--border)}
.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
.list{display:grid;gap:10px;max-height:72vh;overflow:auto}
.row{width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;display:grid;gap:5px;color:var(--text)}
.row.active{border-color:var(--primary);box-shadow:0 0 0 3px rgba(29,78,216,.14)}
.row strong{font-size:14px}
.row span{font-size:12px;color:var(--muted)}
.status{display:inline-flex;width:max-content;border-radius:999px;padding:4px 8px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:950;text-transform:uppercase}
.status.error{background:#fee2e2;color:var(--danger)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.metric{border:1px solid var(--border);border-radius:14px;padding:12px;background:#f8fafc;min-width:0}
.metric span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:900}
.metric strong{display:block;margin-top:5px;overflow-wrap:anywhere}
.section{margin-top:16px}
.section h2{font-size:20px;margin:0 0 10px}
pre{white-space:pre-wrap;overflow:auto;margin:0;background:#0f172a;color:#e5eefb;border-radius:14px;padding:14px;max-height:460px;font-size:12px;line-height:1.5}
.images{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.image-card{border:1px solid var(--border);border-radius:14px;background:#fff;overflow:hidden}
.image-card img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#0f172a}
.image-meta{padding:10px;display:grid;gap:4px}
.image-meta strong{font-size:13px}
.image-meta span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.result-img{max-width:100%;border-radius:14px;border:1px solid var(--border);background:#0f172a}
.empty{padding:32px;text-align:center;color:var(--muted)}
.warn{border-color:#fde68a;background:#fffbeb;color:#92400e}
.error-text{color:var(--danger);font-weight:900}
@media(max-width:900px){.grid{grid-template-columns:1fr}.top{display:grid}.list{max-height:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <h1>Generation Inspector</h1>
      <p>Debug-only view of the final OpenAI prompt, payload, image attachments, and result for catalog generations.</p>
    </div>
    <div class="toolbar card">
      <label>Admin Token <input id="tokenInput" type="password" placeholder="Paste admin token"></label>
      <button id="saveTokenBtn" class="secondary" type="button">Save Token</button>
      <button id="refreshBtn" class="primary" type="button">Refresh</button>
    </div>
  </div>

  <div class="grid">
    <aside class="card">
      <h2 style="margin-top:0">Recent Generations</h2>
      <div id="generationList" class="list"><div class="empty">Enter token and refresh.</div></div>
    </aside>

    <section id="detail" class="card">
      <div class="empty">Choose a generation to inspect.</div>
    </section>
  </div>
</main>

<script>
const TOKEN_KEY = "cv_admin_token";
const listEl = document.getElementById("generationList");
const detailEl = document.getElementById("detail");
const tokenInput = document.getElementById("tokenInput");
const refreshBtn = document.getElementById("refreshBtn");
const saveTokenBtn = document.getElementById("saveTokenBtn");
let currentGeneration = null;

tokenInput.value = localStorage.getItem(TOKEN_KEY) || "";

function token() {
  return tokenInput.value.trim() || localStorage.getItem(TOKEN_KEY) || "";
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(char) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char];
  });
}

function formatDate(value) {
  if (!value) return "-";
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? value : date.toLocaleString();
}

async function api(path) {
  const response = await fetch(path, {
    cache: "no-store",
    headers: {
      "Authorization": "Bearer " + token(),
      "X-Admin-Token": token()
    }
  });
  const data = await response.json().catch(function() { return {}; });
  if (!response.ok) throw new Error(data.error || "Request failed.");
  return data;
}

function renderList(generations) {
  if (!generations.length) {
    listEl.innerHTML = '<div class="empty">No generations recorded yet.</div>';
    return;
  }
  listEl.innerHTML = generations.map(function(item) {
    const summary = item.summary || {};
    const status = item.status || "captured";
    return '<button class="row" type="button" data-id="' + escapeHtml(item.generationId) + '">' +
      '<strong>' + escapeHtml(summary.companyKey || item.generationId) + '</strong>' +
      '<span>' + escapeHtml(formatDate(item.timestamp)) + '</span>' +
      '<span>' + escapeHtml(summary.manufacturer || "No manufacturer") + ' / ' + escapeHtml(summary.cabinetLine || "No line") + '</span>' +
      '<span class="status ' + (status === "error" ? "error" : "") + '">' + escapeHtml(status) + '</span>' +
    '</button>';
  }).join("");
}

function metric(label, value) {
  const display = value === false ? "false" : value === true ? "true" : (value || "-");
  return '<div class="metric"><span>' + escapeHtml(label) + '</span><strong>' + escapeHtml(display) + '</strong></div>';
}

function renderImages(images) {
  if (!images || !images.length) return '<div class="empty">No reference images recorded.</div>';
  return '<div class="images">' + images.map(function(image) {
    return '<div class="image-card">' +
      (image.dataUrl ? '<img src="' + escapeHtml(image.dataUrl) + '" alt="' + escapeHtml(image.role || "Reference image") + '">' : '<div class="empty">No preview</div>') +
      '<div class="image-meta">' +
      '<strong>#' + escapeHtml(image.order) + ' ' + escapeHtml(image.role || "reference") + '</strong>' +
      '<span>' + escapeHtml(image.fileName || "") + '</span>' +
      '<span>' + escapeHtml(image.mime || "") + ' ' + escapeHtml(image.bytes ? image.bytes + " bytes" : "") + '</span>' +
      '</div></div>';
  }).join("") + '</div>';
}

function renderGeometryCandidates(result) {
  const candidates = result.geometryCandidates || [];
  if (!candidates.length) return '<div class="empty">No geometry candidates recorded.</div>';
  const selectedIndex = Number(result.selectedGeometryIndex) || 0;
  return '<div class="images">' + candidates.map(function(dataUrl, index) {
    const selected = index === selectedIndex;
    return '<div class="image-card" style="' + (selected ? 'outline:4px solid #16a34a;' : '') + '">' +
      '<img src="' + escapeHtml(dataUrl) + '" alt="Geometry candidate ' + escapeHtml(index + 1) + '">' +
      '<div class="image-meta"><strong>Candidate ' + escapeHtml(index + 1) + (selected ? ' • SELECTED' : '') + '</strong></div></div>';
  }).join("") + '</div>';
}

function renderDetail(generation) {
  currentGeneration = generation;
  const summary = generation.summary || {};
  const result = generation.result || {};
  const warnings = generation.warnings || [];
  detailEl.innerHTML =
    '<div class="section" style="margin-top:0"><h2>Generation Summary</h2><div class="summary">' +
      metric("Generation ID", generation.generationId) +
      metric("Timestamp", formatDate(generation.timestamp)) +
      metric("Status", generation.status) +
      metric("Model", generation.model || (generation.payload && generation.payload.model)) +
      metric("Prompt Version", generation.promptVersion || (generation.payload && generation.payload.promptVersion)) +
      metric("OpenAI Requests", summary.requestCount || (generation.payload && generation.payload.requestCount) || 1) +
      metric("Quality", generation.quality || (generation.payload && generation.payload.quality)) +
      metric("Company Key", summary.companyKey) +
      metric("Manufacturer", summary.manufacturer) +
      metric("Cabinet Line", summary.cabinetLine) +
      metric("Door Style", summary.doorStyle) +
      metric("Door Construction", summary.doorConstructionType) +
      metric("Drawer Front", summary.drawerFront) +
      metric("Drawer Construction", summary.drawerConstructionType) +
      metric("Master Door Width", summary.doorMasterWidthInches ? summary.doorMasterWidthInches + " in" : "") +
      metric("Rail And Stile Width", summary.doorFrameWidthInches ? summary.doorFrameWidthInches + " in" : "") +
      metric("Upper Finish", summary.upperFinish) +
      metric("Base Finish", summary.baseFinish) +
      metric("Countertop", summary.countertop) +
      metric("Backsplash", summary.backsplash) +
      metric("Flooring", summary.flooring) +
      metric("Generation Time", result.generationTimeMs ? result.generationTimeMs + " ms" : "") +
      metric("Image Size", result.imageSize || "") +
      metric("Kitchen Attached", generation.attachmentStatus ? generation.attachmentStatus.kitchen : "") +
      metric("Door Attached", generation.attachmentStatus ? generation.attachmentStatus.catalogDoor : "") +
      metric("Drawer Attached", generation.attachmentStatus ? generation.attachmentStatus.catalogDrawer : "") +
      metric("Upper Swatch Attached", generation.attachmentStatus ? generation.attachmentStatus.upperSwatch : "") +
    '</div></div>' +
    (generation.error ? '<div class="section card warn"><strong>Error</strong><p class="error-text">' + escapeHtml(generation.error.message || generation.error) + '</p></div>' : '') +
    (warnings.length ? '<div class="section card warn"><strong>Warnings</strong><p>' + escapeHtml(warnings.join("\\n")) + '</p></div>' : '') +
    '<div class="section"><button class="secondary" type="button" id="copyPromptBtn">Copy Prompt</button> ' +
    '<button class="secondary" type="button" id="copyPayloadBtn">Copy Payload</button> ' +
    '<button class="primary" type="button" id="downloadJsonBtn">Download Debug JSON</button></div>' +
    '<div class="section"><h2>Saved Geometry Specifications</h2><div class="summary">' +
      metric("Door Construction", summary.doorConstructionType) +
      metric("Drawer Construction", summary.drawerConstructionType) +
      metric("Attachment Order", (generation.referenceImages || []).map(function(image) { return "#" + image.order + " " + image.role; }).join(" | ")) +
    '</div><h3>Door</h3><pre>' + escapeHtml(summary.doorProfileDescription || "Missing") + '\n\nMUST AVOID: ' + escapeHtml(summary.doorProfileMustAvoid || "Missing") + '</pre>' +
    '<h3>Drawer Front</h3><pre>' + escapeHtml(summary.drawerProfileDescription || "Missing") + '\n\nMUST AVOID: ' + escapeHtml(summary.drawerProfileMustAvoid || "Missing") + '</pre></div>' +
    '<div class="section"><h2>Prompt</h2><pre>' + escapeHtml(generation.prompt || "") + '</pre></div>' +
    '<div class="section"><h2>Payload JSON</h2><pre>' + escapeHtml(JSON.stringify(generation.payload || {}, null, 2)) + '</pre></div>' +
    '<div class="section"><h2>Reference Images</h2>' + renderImages(generation.referenceImages || []) + '</div>' +
    '<div class="section"><h2>Calculated Master Measurements</h2><pre>' + escapeHtml(result.masterMeasurements || summary.masterMeasurements || (generation.payload && generation.payload.masterMeasurements) || "No measurements recorded.") + '</pre></div>' +
    '<div class="section"><h2>Geometry Candidates</h2>' + renderGeometryCandidates(result) +
      '<h3>Automatic Selection</h3><pre>' + escapeHtml(JSON.stringify(result.geometrySelection || {}, null, 2)) + '</pre></div>' +
    '<div class="section"><h2>Selected Geometry Stage</h2>' + (result.geometryImage ? '<img class="result-img" src="' + escapeHtml(result.geometryImage) + '" alt="Selected geometry stage">' : '<div class="empty">No selected geometry image recorded.</div>') + '</div>' +
    '<div class="section"><h2>Generated Result</h2>' + (result.image ? '<img class="result-img" src="' + escapeHtml(result.image) + '" alt="Generated result">' : '<div class="empty">No generated image recorded.</div>') + '</div>';
}

async function loadList() {
  listEl.innerHTML = '<div class="empty">Loading...</div>';
  try {
    const data = await api("/api/admin/generation-inspector?limit=4");
    renderList(data.generations || []);
    if ((data.generations || []).length) loadDetail(data.generations[0].generationId);
  } catch (error) {
    listEl.innerHTML = '<div class="empty error-text">' + escapeHtml(error.message) + '</div>';
  }
}

async function loadDetail(id) {
  if (!id) return;
  detailEl.innerHTML = '<div class="empty">Loading generation...</div>';
  try {
    const data = await api("/api/admin/generation-inspector?id=" + encodeURIComponent(id));
    renderDetail(data.generation);
    document.querySelectorAll(".row").forEach(function(row) {
      row.classList.toggle("active", row.dataset.id === id);
    });
  } catch (error) {
    detailEl.innerHTML = '<div class="empty error-text">' + escapeHtml(error.message) + '</div>';
  }
}

function copyText(text) {
  return navigator.clipboard.writeText(text || "");
}

function downloadDebugJson() {
  if (!currentGeneration) return;
  const blob = new Blob([JSON.stringify(currentGeneration, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "generation-debug-" + currentGeneration.generationId + ".json";
  a.click();
  URL.revokeObjectURL(url);
}

saveTokenBtn.addEventListener("click", function() {
  localStorage.setItem(TOKEN_KEY, tokenInput.value.trim());
});
refreshBtn.addEventListener("click", loadList);
listEl.addEventListener("click", function(event) {
  const row = event.target.closest("[data-id]");
  if (row) loadDetail(row.dataset.id);
});
detailEl.addEventListener("click", function(event) {
  if (!currentGeneration) return;
  if (event.target.id === "copyPromptBtn") copyText(currentGeneration.prompt || "");
  if (event.target.id === "copyPayloadBtn") copyText(JSON.stringify(currentGeneration.payload || {}, null, 2));
  if (event.target.id === "downloadJsonBtn") downloadDebugJson();
});

if (token()) loadList();
</script>
</body>
</html>
