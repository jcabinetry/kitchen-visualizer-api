<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabinet Visualizer Admin</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;font-family:Arial,sans-serif;color:#172033}.box{background:#fff;border:1px solid #d9dee8;border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(23,32,51,.08);max-width:520px}</style></head><body><div class="box">Loading admin dashboard...</div><script>fetch('https://raw.githubusercontent.com/jcabinetry/kitchen-visualizer-api/main/admin.html?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Could not load admin file');return r.text()}).then(html=>{html=html.replaceAll('/api/import-catalog','/api/import-catalog-any');html=html.replace('</body>','<button id="cvCatBtn" style="position:fixed;right:18px;bottom:18px;z-index:99999;border:0;border-radius:999px;background:#2457a6;color:white;padding:14px 18px;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.22)">Catalog Manager</button><div id="cvCatModal" style="display:none;position:fixed;inset:0;z-index:100000;background:rgba(15,23,42,.62);padding:18px"><div style="height:100%;max-width:1160px;margin:auto;background:white;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35)"><button id="cvCatClose" style="float:right;margin:10px;border:0;border-radius:10px;background:#fff0ee;color:#b42318;padding:10px 14px;font-weight:900">Close</button><iframe src="/catalog-dashboard-v2.html" style="width:100%;height:calc(100% - 0px);border:0"></iframe></div></div><script>setTimeout(function(){var b=document.getElementById("cvCatBtn"),m=document.getElementById("cvCatModal"),c=document.getElementById("cvCatClose");if(b)b.onclick=function(){m.style.display="block"};if(c)c.onclick=function(){m.style.display="none"};window.addEventListener("message",function(e){if(e.data&&e.data.type==="catalogs-updated"){var r=document.getElementById("refreshCatalogsButton");if(r)r.click();setTimeout(function(){var s=document.getElementById("statusLine");if(s)s.textContent="Catalog list refreshed."},500)}})},300)<\/script></body>');document.open();document.write(html);document.close()}).catch(err=>{document.body.innerHTML='<div class="box"><h1>Admin loading error</h1><p>'+err.message+'</p></div>'})</script></body></html>
