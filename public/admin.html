<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabinet Visualizer Admin</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1250px;margin:0 auto;padding:22px}.card{background:#fff;border:1px solid #d9dee8;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(23,32,51,.08)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}label{display:block;font-size:12px;font-weight:900;color:#647084;text-transform:uppercase;margin:8px 0 5px}input,select,button{width:100%;min-height:42px;border-radius:10px;border:1px solid #d9dee8;padding:9px;font:inherit}button{border:0;background:#2457a6;color:white;font-weight:900;cursor:pointer}.neutral{background:#eef1f6;color:#172033}.muted{color:#647084;font-size:13px}.status{min-height:22px;color:#647084;font-weight:800}.catbox{max-height:360px;overflow:auto;border:1px solid #d9dee8;border-radius:12px;background:#fff;padding:10px}.cat{border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:8px 0}.row{display:flex;gap:8px;align-items:center}.row input{width:auto;min-height:auto}.line{margin-left:24px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}@media(max-width:850px){.two,.grid,.actions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Cabinet Visualizer Admin</h1><div class="card"><label>Admin Token<input id="token" type="password" placeholder="Enter admin token"></label><button id="load">Load Admin</button><div id="msg" class="status"></div></div><div class="two"><div class="card"><h2>Customers</h2><input id="search" placeholder="Search customers"><div id="customers"></div></div><div class="card"><h2 id="title">Create / Edit Customer</h2><div class="grid"><label>Company Key<input id="companyKey"></label><label>Company Name<input id="companyName"></label><label>Monthly Limit<input id="monthlyLimit" type="number" value="200"></label><label>Monthly Price<input id="monthlyPrice" type="number" value="199"></label><label>Plan<select id="plan"><option>Trial</option><option>Starter</option><option>Professional</option><option>Enterprise</option></select></label><label>Status<select id="custStatus"><option value="active">Active</option><option value="archived">Inactive</option></select></label><label>Phone<input id="phone"></label><label>Email<input id="email"></label><label>Logo URL<input id="logoUrl"></label><label>Customer Page URL<input id="websiteUrl"></label></div><div class="card"><h3>Add / Update Manufacturer Catalog</h3><div class="grid"><label>Manufacturer Name<input id="catalogName" placeholder="Aristokraft"></label><label>Catalog Link<input id="catalogUrl" placeholder="https://..."></label></div><button id="importCatalog">Import / Update Catalog</button><p class="muted">After importing, choose the catalog and lines below, then click Save Customer.</p></div><div class="card"><h3>Catalogs This Customer Can Use</h3><div id="catalogPicker" class="catbox"></div></div><div class="actions"><button id="newBtn" class="neutral">New</button><button id="saveBtn">Save Customer</button><button id="copyBtn" class="neutral">Copy Custom Embed</button></div></div></div></div><script>let customers=[],catalogs=[],selected='';const $=id=>document.getElementById(id);function msg(t,e){$('msg').textContent=t||'';$('msg').style.color=e?'#b42318':'#647084'}async function api(p,o={}){let r=await fetch(p,{...o,cache:'no-store',headers:{'Content-Type':'application/json','X-Admin-Token':$('token').value.trim(),...(o.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(v){return String(v||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function embed(k){return '<iframe src="https://kitchen-visualizer-api.vercel.app/custom-visualizer.html?companyKey='+k+'" style="width:100%;height:2100px;border:none;background:white;" loading="lazy"></iframe>'}async function load(){msg('Loading...');customers=(await api('/api/admin/customers?_='+Date.now())).customers||[];catalogs=(await api('/api/catalogs?_='+Date.now())).catalogs||[];renderCustomers();renderPicker(getCurrent()?.catalogSelections||[]);msg('Loaded')}function getCurrent(){return customers.find(c=>c.companyKey===selected)}function renderCustomers(){let q=$('search').value.toLowerCase();$('customers').innerHTML=customers.filter(c=>(String(c.companyName)+' '+String(c.companyKey)).toLowerCase().includes(q)).map(c=>'<div class="cat"><b>'+esc(c.companyName)+'</b><div class="muted">'+esc(c.companyKey)+'</div><div class="actions"><button data-edit="'+esc(c.companyKey)+'">Edit</button><button data-copy="'+esc(c.companyKey)+'" class="neutral">Copy</button></div></div>').join('')||'<p class="muted">No customers found.</p>'}function renderPicker(sel=[]){let box=$('catalogPicker');if(!catalogs.length){box.innerHTML='<p class="muted">No catalogs saved yet. Import one above.</p>';return}box.innerHTML=catalogs.map(cat=>{let cur=sel.find(s=>s.catalogId===cat.catalogId)||{};let on=!!cur.catalogId;let lines=(cat.manufacturers||[]).flatMap(m=>(m.lines||[]).map(l=>({m:m.id||cat.catalogId,l})));let lineHtml=lines.map(x=>{let ck=on&&(!cur.lineIds||!cur.lineIds.length||cur.lineIds.includes(x.l.id));return '<label class="row line"><input type="checkbox" class="lineBox" data-cat="'+esc(cat.catalogId)+'" data-man="'+esc(x.m)+'" value="'+esc(x.l.id)+'" '+(ck?'checked':'')+'> '+esc(x.l.name)+' <span class="muted">('+((x.l.doors||[]).length)+' doors, '+((x.l.finishes||[]).length)+' finishes)</span></label>'}).join('');return '<div class="cat"><label class="row"><input type="checkbox" class="catBox" data-cat="'+esc(cat.catalogId)+'" '+(on?'checked':'')+'> <b>'+esc(cat.name||cat.catalogId)+'</b></label>'+lineHtml+'</div>'}).join('');document.querySelectorAll('.catBox').forEach(cb=>cb.onchange=()=>document.querySelectorAll('.lineBox[data-cat="'+CSS.escape(cb.dataset.cat)+'"]').forEach(l=>l.checked=cb.checked))}function selections(){return catalogs.map(cat=>{let cb=document.querySelector('.catBox[data-cat="'+CSS.escape(cat.catalogId)+'"]');if(!cb||!cb.checked)return null;let lines=[...document.querySelectorAll('.lineBox[data-cat="'+CSS.escape(cat.catalogId)+'"]:checked')];return{catalogId:cat.catalogId,manufacturerId:lines[0]?.dataset.man||cat.catalogId,lineIds:lines.map(l=>l.value),autoUpdate:true,lockedVersion:''}}).filter(Boolean)}function edit(k){let c=customers.find(x=>x.companyKey===k);if(!c)return;selected=k;$('title').textContent='Edit Customer';$('companyKey').value=c.companyKey||'';$('companyKey').disabled=true;$('companyName').value=c.companyName||'';$('monthlyLimit').value=c.monthlyLimit||200;$('monthlyPrice').value=c.monthlyPrice||0;$('plan').value=c.plan||'Trial';$('custStatus').value=c.status||'active';$('phone').value=c.phone||'';$('email').value=c.email||'';$('logoUrl').value=c.logoUrl||'';$('websiteUrl').value=c.websiteUrl||'';renderPicker(c.catalogSelections||[])}function reset(){selected='';$('title').textContent='Create Customer';$('companyKey').disabled=false;['companyKey','companyName','phone','email','logoUrl','websiteUrl'].forEach(id=>$(id).value='');$('monthlyLimit').value=200;$('monthlyPrice').value=199;$('plan').value='Trial';$('custStatus').value='active';renderPicker([])}function payload(){return{companyKey:$('companyKey').value.trim(),companyName:$('companyName').value.trim(),monthlyLimit:Number($('monthlyLimit').value||200),monthlyPrice:Number($('monthlyPrice').value||0),plan:$('plan').value,status:$('custStatus').value,phone:$('phone').value,email:$('email').value,logoUrl:$('logoUrl').value,websiteUrl:$('websiteUrl').value,customerPageUrl:$('websiteUrl').value,catalogSelections:selections(),branding:{phone:$('phone').value,email:$('email').value,logoUrl:$('logoUrl').value,websiteUrl:$('websiteUrl').value}}}async function save(){let d=await api('/api/admin/customers',{method:selected?'PATCH':'POST',body:JSON.stringify(payload())});await load();edit(d.customer.companyKey);msg('Saved customer')}async function importCat(){msg('Importing catalog...');await api('/api/import-catalog',{method:'POST',body:JSON.stringify({name:$('catalogName').value.trim(),sourceUrl:$('catalogUrl').value.trim()})});$('catalogName').value='';$('catalogUrl').value='';await load();msg('Catalog imported. Select it below and save customer.')}function copyEmbed(k){navigator.clipboard.writeText(embed(k));msg('Embed copied')}$('load').onclick=()=>load().catch(e=>msg(e.message,true));$('search').oninput=renderCustomers;$('newBtn').onclick=reset;$('saveBtn').onclick=()=>save().catch(e=>msg(e.message,true));$('importCatalog').onclick=()=>importCat().catch(e=>msg(e.message,true));$('copyBtn').onclick=()=>copyEmbed($('companyKey').value.trim());$('customers').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.edit)edit(b.dataset.edit);if(b.dataset.copy)copyEmbed(b.dataset.copy)};reset();</script></body></html>
