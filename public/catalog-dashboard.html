<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog Manager</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1050px;margin:0 auto;padding:22px}.card{background:#fff;border:1px solid #d9dee8;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 10px 30px rgba(23,32,51,.08)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:12px;font-weight:900;color:#647084;text-transform:uppercase;margin:8px 0 5px}input,textarea,button{width:100%;min-height:42px;border-radius:10px;border:1px solid #d9dee8;padding:9px;font:inherit}textarea{min-height:135px}button{border:0;background:#2457a6;color:white;font-weight:900;cursor:pointer}.danger{background:#fff0ee;color:#b42318}.neutral{background:#eef1f6;color:#172033}.muted{color:#647084;font-size:13px;line-height:1.45}.status{min-height:24px;color:#647084;font-weight:800}.cat{border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin:10px 0;background:#fff}.cat h3{margin:0 0 4px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.pill{display:inline-block;border-radius:999px;background:#eef3ff;color:#2457a6;font-size:11px;font-weight:900;padding:5px 8px;margin:4px 4px 0 0}@media(max-width:750px){.grid,.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Manufacturer Catalog Manager</h1><p class="muted">Add supplier catalogs here. Add multiple sources for one manufacturer when doors, colors, finishes, and specs are separate. The AI extractor reads PDF/website text and saves the full catalog to use on customer accounts.</p><div class="card"><div class="grid"><label>Admin Token<input id="token" type="password" placeholder="Admin token"></label><label>Manufacturer / Catalog Name<input id="name" placeholder="Merillat Classic 2025"></label></div><label>Catalog Sources <span class="muted">one link per line</span><textarea id="sources" placeholder="Door style catalog link&#10;Color / finish catalog link&#10;Spec sheet link"></textarea></label><button id="save">AI Extract / Update Catalog</button><div id="msg" class="status"></div></div><div class="card"><div class="row"><h2>Saved Catalogs</h2><button id="refresh" class="neutral">Refresh</button></div><div id="list"></div></div></div><script>let catalogs=[];const $=id=>document.getElementById(id);function msg(t,e){$('msg').textContent=t||'';$('msg').style.color=e?'#b42318':'#647084'}async function api(p,o={}){let r=await fetch(p,{...o,cache:'no-store',headers:{'Content-Type':'application/json','X-Admin-Token':$('token').value.trim(),...(o.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(v){return String(v||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}async function load(){msg('Loading catalogs...');catalogs=(await api('/api/catalogs?_='+Date.now())).catalogs||[];render();msg('Loaded.')}function counts(cat){let doors=0,finishes=0,lines=0;(cat.manufacturers||[]).forEach(m=>(m.lines||[]).forEach(l=>{lines++;doors+=(l.doors||[]).length;finishes+=(l.finishes||[]).length}));return{lines,doors,finishes}}function render(){let box=$('list');if(!catalogs.length){box.innerHTML='<p class="muted">No catalogs saved yet.</p>';return}box.innerHTML='';catalogs.forEach(cat=>{let c=counts(cat);let sources=cat.sourceUrls||[cat.sourceUrl].filter(Boolean);let div=document.createElement('div');div.className='cat';div.innerHTML='<div class="row"><div><h3>'+esc(cat.name||cat.catalogId)+'</h3><div class="muted">'+esc(cat.catalogId)+' • '+c.lines+' lines • '+c.doors+' doors • '+c.finishes+' finishes • status: '+esc(cat.extraction?.status||cat.status||'active')+'</div><div>'+sources.map((s,i)=>'<span class="pill">Source '+(i+1)+'</span>').join('')+'</div></div><button class="danger" data-del="'+esc(cat.catalogId)+'">Delete</button></div>';box.appendChild(div)})}async function save(){let sourceUrls=$('sources').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!$('name').value.trim())throw Error('Manufacturer name required.');if(!sourceUrls.length)throw Error('Add at least one catalog link.');msg('AI extracting catalog. Large PDFs may take a little while...');await api('/api/extract-catalog-ai',{method:'POST',body:JSON.stringify({name:$('name').value.trim(),sourceUrls})});$('sources').value='';await load();msg('AI extraction complete. Open/edit a customer and select this catalog.')}async function del(id){if(!confirm('Delete catalog '+id+'?'))return;await api('/api/catalogs?catalogId='+encodeURIComponent(id),{method:'DELETE'});await load();msg('Catalog deleted.')}document.getElementById('save').onclick=()=>save().catch(e=>msg(e.message,true));document.getElementById('refresh').onclick=()=>load().catch(e=>msg(e.message,true));document.getElementById('list').onclick=e=>{let b=e.target.closest('button[data-del]');if(b)del(b.dataset.del).catch(err=>msg(err.message,true))};msg('Enter admin token, then refresh or import.');</script></body></html>
