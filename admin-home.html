<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabinet Visualizer Admin Home</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #d9dee8;box-shadow:0 8px 24px rgba(23,32,51,.08)}.bar{max-width:1500px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:20px;font-weight:900}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:0;border-radius:999px;padding:11px 16px;font-weight:900;cursor:pointer;background:#eef3ff;color:#2457a6}.tab.active{background:#2457a6;color:white}.frame-wrap{height:calc(100vh - 72px)}iframe{width:100%;height:100%;border:0;background:white}.note{font-size:13px;color:#647084;font-weight:700}@media(max-width:720px){.bar{align-items:flex-start;flex-direction:column}.frame-wrap{height:calc(100vh - 120px)}.tab{width:100%}.tabs{width:100%;display:grid;grid-template-columns:1fr}}</style></head><body><div class="top"><div class="bar"><div><div class="brand">Cabinet Visualizer Admin</div><div class="note">Customers + Manufacturer Catalogs in one place</div></div><div class="tabs"><button class="tab active" data-src="/admin.html">Customers</button><button class="tab" data-src="/catalog-manager.html">Manufacturer Catalogs</button></div></div></div><div class="frame-wrap"><iframe id="frame" src="/admin.html"></iframe></div><script>document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('frame').src=btn.dataset.src+'?v='+Date.now()}));</script></body></html>
